<!doctype html>
<html lang="en">
<head>
  <script>
  (function applySystemThemeMode() {
    const prefersDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-bs-theme', prefersDarkMode ? 'dark' : 'light');
  })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Title}}</title>
  <link href="/p/static/technical_pages.css" rel="stylesheet">
</head>
<body class="technical-page">
<main class="container">
  <div class="page-header">
    <h1 class="section-heading"><img src="/p/static/profile.png" class="section-icon" alt=""><a href="/">{{.Domain}}</a> <small class="text-muted">| {{.Title}}</small></h1>
    <a class="btn btn-outline-secondary" href="/">{{index .T "back_to_uri"}}</a>
  </div>
  {{if .Status}}<p class="hint">{{.Status}}</p>{{end}}
  <form class="profile-form" method="post" action="?profile">
    <label>
      {{.EmailLabel}}
      <input type="email" name="email" value="{{.Email}}" autocomplete="email" required>
    </label>
    <label>
      {{.PasswordLabel}}
      <input type="password" name="password" autocomplete="new-password">
    </label>
    <label>
      {{.PasswordConfirmLabel}}
      <input type="password" name="password_confirm" autocomplete="new-password">
    </label>
    <div><button type="submit">{{.SaveLabel}}</button></div>
  </form>
</main>
</body>
</html>
