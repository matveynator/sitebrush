<!doctype html>
<html lang="en">
<head>
  <script>
  (function applySystemThemeMode() {
    const prefersDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-bs-theme', prefersDarkMode ? 'dark' : 'light');
  })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Title}}</title>
  <style>
    :root {
      color-scheme: light dark;
      --page-bg:#f4f8fc;
      --surface:#ffffff;
      --text-main:#1b2a3d;
      --hint:#4f5f79;
      --field-bg:#ffffff;
      --field-text:#12253f;
      --field-border:#b9c7db;
      --link:#1a65d8;
      --line:#d7e1ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg:#0f1724;
        --surface:#121f32;
        --text-main:#dbe8ff;
        --hint:#9fb3cf;
        --field-bg:#0f1a2b;
        --field-text:#dbe8ff;
        --field-border:#334868;
        --link:#9ec2ff;
        --line:#263a57;
      }
    }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 760px; background: var(--page-bg); color: var(--text-main); }
    a { color: var(--link); }
    input, button { font: inherit; }
    input { width: 100%; background: var(--field-bg); color: var(--field-text); border: 1px solid var(--field-border); border-radius: 6px; padding: 10px 12px; }
    button { border: 1px solid var(--link); border-radius: 6px; padding: 9px 14px; background: var(--link); color: #fff; cursor: pointer; }
    label { display: grid; gap: 6px; font-weight: 700; }
    .profile-form { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; max-width: 520px; }
    .hint { color: var(--hint); }
    .section-icon { width:30px; height:30px; object-fit:contain; }
    .section-heading { display:flex; align-items:center; gap:10px; margin: 0; }
    @media (max-width: 700px) {
      body { margin: 16px; }
    }
  </style>
</head>
<body>
  <h1 class="section-heading"><img src="/p/static/profile.png" class="section-icon" alt=""><a href="/">{{.Domain}}</a> | {{.Title}}</h1>
  <p><a href="/">{{index .T "back_to_uri"}}</a></p>
  {{if .Status}}<p class="hint">{{.Status}}</p>{{end}}
  <form class="profile-form" method="post" action="?profile">
    <label>
      {{.EmailLabel}}
      <input type="email" name="email" value="{{.Email}}" autocomplete="email" required>
    </label>
    <label>
      {{.PasswordLabel}}
      <input type="password" name="password" autocomplete="new-password">
    </label>
    <label>
      {{.PasswordConfirmLabel}}
      <input type="password" name="password_confirm" autocomplete="new-password">
    </label>
    <div><button type="submit">{{.SaveLabel}}</button></div>
  </form>
</body>
</html>
