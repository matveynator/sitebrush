<!doctype html>
<html id="SiteBrush" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Восстановление пароля</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class='page-header mb-4'><h1><a href='/'>SiteBrush</a> <small class="text-muted">| Восстановление пароля.</small></h1></div>
  <form class="card card-body shadow-sm" method="post" action="?recover" style="max-width:560px;">
    <p><input type='text' class="form-control" name='email' placeholder="введите email администратора..."></p>
    <p class="d-flex align-items-center gap-2"><input type="text" class="form-control" name="captcha" placeholder="введите цифры -->" style="max-width:220px;"/>
    <img src="?captcha" alt="Введите цифры с картинки." title="введите цифры -->"></p>
    <input type="submit" class="btn btn-primary" value="восстановить пароль"/>
  </form>
  {{if .Status}}<div class="alert alert-info mt-3" style="max-width:560px;">{{.Status}}</div>{{end}}
</div>
</body>
</html>
