<!doctype html>
<html lang="{{.LanguageCode}}" dir="{{.TextDirection}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>AI voice editor</title>
  <link rel="stylesheet" href="/p/static/admin_theme.css">
  <style>
    body { margin:0; min-height:100vh; background:var(--theme-background); color:var(--theme-foreground); font-family:var(--theme-font-sans); }
    main { max-width:860px; margin:0 auto; padding:32px 20px; }
    .panel { background:var(--theme-card); border:1px solid var(--theme-border); border-radius:var(--theme-radius); padding:24px; display:grid; gap:18px; }
    textarea { width:100%; min-height:130px; box-sizing:border-box; resize:vertical; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; }
    .status { min-height:24px; white-space:pre-wrap; }
    pre { overflow-wrap:anywhere; white-space:pre-wrap; }
  </style>
</head>
<body>
<main>
  <section class="panel">
    <h1>AI voice editor</h1>
    <p>Describe the change, attach material, and let SiteBrush prepare or publish content for this site. The AI connection is limited to site content and never receives account or server access.</p>
    <label for="aiCommand">Voice command or text</label>
    <textarea id="aiCommand" placeholder="For example: create a page about my hike and add a news link to the home page"></textarea>
    <div class="actions">
      <button id="recordButton" type="button">Start voice input</button>
      <button id="capabilityButton" type="button">Invite your AI assistant - create invite link</button>
      <a class="btn btn-secondary" href="{{.Path}}">Back</a>
    </div>
    <input id="fileInput" type="file" multiple accept="image/*,.css,.html,.txt">
    <label for="provider">AI provider</label>
    <select id="provider"><option value="openai-compatible">OpenAI-compatible</option><option value="anthropic">Anthropic</option><option value="deepseek">DeepSeek</option><option value="qwen">Qwen</option></select>
    <label for="model">Model</label>
    <input id="model" type="text" autocomplete="off" placeholder="Model name">
    <label for="apiKey">Your AI API token</label>
    <input id="apiKey" type="password" autocomplete="new-password" placeholder="Enter once; SiteBrush stores it encrypted">
    <div><a id="providerKeyLink" href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer">Get API token ↗</a> <span id="providerKeyStatus"></span></div>
    <button id="executeButton" type="button">Execute task on this page</button>
    <div id="status" class="status" role="status"></div>
    <pre id="capabilityOutput" hidden></pre>
  </section>
</main>
<script>
const commandElement = document.getElementById('aiCommand');
const recordButton = document.getElementById('recordButton');
const capabilityButton = document.getElementById('capabilityButton');
const statusElement = document.getElementById('status');
const capabilityOutputElement = document.getElementById('capabilityOutput');
const executeButton = document.getElementById('executeButton');
const providerElement = document.getElementById('provider');
const modelElement = document.getElementById('model');
const apiKeyElement = document.getElementById('apiKey');
const providerKeyLink = document.getElementById('providerKeyLink');
const providerKeyStatus = document.getElementById('providerKeyStatus');
const providerLinks = {
  'openai-compatible':'https://platform.openai.com/api-keys',
  'anthropic':'https://console.anthropic.com/settings/keys',
  'deepseek':'https://platform.deepseek.com/api_keys',
  'qwen':'https://modelstudio.console.alibabacloud.com/model/settings/api-key'
};
const credentialStatus = Object.create(null);
const savedAIEditorCommand = sessionStorage.getItem('sitebrush.aiEditorCommand');
if (savedAIEditorCommand) {
  commandElement.value = savedAIEditorCommand;
  sessionStorage.removeItem('sitebrush.aiEditorCommand');
  setStatus('Команда из меню редактора восстановлена. Добавьте файлы и продолжите работу.');
}
function setStatus(message) { statusElement.textContent = message; }
function updateProviderCredentialUI() {
  providerKeyLink.href = providerLinks[providerElement.value] || providerLinks['openai-compatible'];
  const saved = credentialStatus[providerElement.value];
  providerKeyStatus.textContent = saved && saved.saved ? 'Token saved' : 'Token not saved yet';
  if (saved && saved.model && !modelElement.value.trim()) modelElement.value = saved.model;
  apiKeyElement.placeholder = saved && saved.saved ? 'Leave blank to reuse the saved token' : 'Enter once; SiteBrush stores it encrypted';
}
async function loadCredentialStatus() {
  try {
    const response = await fetch('{{.Path}}?ai_provider_status', {credentials:'same-origin'});
    const payload = await response.json();
    if (!response.ok) throw new Error('status unavailable');
    for (const item of (payload.providers || [])) credentialStatus[item.provider] = item;
    updateProviderCredentialUI();
  } catch (_) {}
}
providerElement.addEventListener('change', updateProviderCredentialUI);
loadCredentialStatus();
if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const speechRecognition = new Recognition();
  speechRecognition.continuous = false;
  speechRecognition.interimResults = false;
  speechRecognition.onresult = function onSpeechResult(event) {
    commandElement.value = event.results[0][0].transcript;
    setStatus('Voice command captured.');
  };
  speechRecognition.onerror = function onSpeechError() { setStatus('Voice input failed. You can enter the command as text.'); };
  recordButton.addEventListener('click', function startVoiceInput() { speechRecognition.start(); setStatus('Listening…'); });
} else {
  recordButton.disabled = true;
  setStatus('This browser does not provide speech recognition. Text input remains available.');
}
capabilityButton.addEventListener('click', async function createCapabilityLink() {
  capabilityButton.disabled = true;
  setStatus('Creating a revocable external AI link…');
  try {
    const response = await fetch('{{.Path}}?ai_capability_create', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({page_path:'{{.Path}}', task:document.getElementById('aiCommand').value})});
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || 'Capability creation failed');
    capabilityOutputElement.hidden = false;
    capabilityOutputElement.textContent = payload.url;
    setStatus('Copy this link into an AI system. Revoke it when it is no longer needed.');
  } catch (error) { setStatus(error.message); }
  capabilityButton.disabled = false;
});
executeButton.addEventListener('click', async function executeTaskOnCurrentPage() {
  executeButton.disabled = true;
  setStatus('Sending the current page and task to the AI provider…');
  try {
    const files = await Promise.all(Array.from(document.getElementById('fileInput').files || []).map(function readFile(file) {
      return new Promise(function resolveFile(resolve, reject) {
        const reader = new FileReader();
        reader.onload = function fileReadCompleted() { resolve({name:file.name, content:String(reader.result).split(',')[1] || ''}); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }));
    const response = await fetch('{{.Path}}?ai_execute', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify({provider:providerElement.value, model:modelElement.value, api_key:apiKeyElement.value, page_path:'{{.Path}}', task:commandElement.value, files:files})});
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || 'AI task failed');
    apiKeyElement.value = '';
    await loadCredentialStatus();
    setStatus('The AI updated ' + payload.path + (payload.published ? ' and published it.' : '.'));
  } catch (error) { setStatus(error.message); }
  executeButton.disabled = false;
});
</script>
</body>
</html>
