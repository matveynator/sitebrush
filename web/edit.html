<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit {{.Path}}</title>
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #f4f8fc; font-family: Arial, sans-serif; }
    .editor-page { min-height: 100%; display: flex; flex-direction: column; padding: 10px; gap: 10px; }
    .editor-topbar { display:flex; justify-content:space-between; align-items:center; }
    .save-button { background:#1ea74f; color:#fff; border:0; padding:10px 16px; border-radius:6px; cursor:pointer; }
    .cancel-link { color:#1f3f6f; text-decoration:none; }
    #visualEditorRoot { flex: 1; min-height: 75vh; }
  </style>
</head>
<body>
<form id="visualEditorForm" method="post" action="/save" class="editor-page">
  <input type="hidden" name="path" value="{{.Path}}" />
  <input type="hidden" name="title" value="{{.Title}}" />
  <input type="hidden" id="htmlContentField" name="html" />

  <div class="editor-topbar">
    <button class="save-button" type="submit">Save</button>
    <a class="cancel-link" href="{{.Path}}">Cancel</a>
  </div>

  <div id="visualEditorRoot"></div>

  <div class="editor-topbar">
    <button class="save-button" type="submit">Save</button>
    <a class="cancel-link" href="{{.Path}}">Cancel</a>
  </div>
</form>

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script>
const initialHtmlContent = {{printf "%q" .HTML}};

function createVisualHtmlEditor() {
  return new toastui.Editor({
    el: document.querySelector('#visualEditorRoot'),
    initialValue: initialHtmlContent,
    initialEditType: 'wysiwyg',
    previewStyle: 'vertical',
    height: '100%'
  });
}

function connectSavePipeline(visualHtmlEditor) {
  const visualEditorFormElement = document.getElementById('visualEditorForm');
  const htmlContentFieldElement = document.getElementById('htmlContentField');
  visualEditorFormElement.addEventListener('submit', function onSubmit() {
    htmlContentFieldElement.value = visualHtmlEditor.getHTML();
  });
}

const visualHtmlEditor = createVisualHtmlEditor();
connectSavePipeline(visualHtmlEditor);
</script>
</body>
</html>
