<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit {{.Path}}</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #f4f8fc; font-family: Arial, sans-serif; }
    .editor-page { min-height: 100%; display: flex; flex-direction: column; padding: 10px; }
    .editor-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .cancel-link { color:#1f3f6f; text-decoration:none; }
    .editor-form { flex: 1; display: flex; flex-direction: column; }
    #editor { flex: 1; min-height: 80vh; }
  </style>
</head>
<body>
<div class="editor-page">
  <div class="editor-header">
    <strong>Edit {{.Path}}</strong>
    <a class="cancel-link" href="{{.Path}}">Cancel</a>
  </div>
  <form id="editorForm" method="post" action="/save" class="editor-form">
    <input type="hidden" name="path" value="{{.Path}}" />
    <input type="hidden" name="title" value="{{.Title}}" />
    <textarea id="editor" name="html">{{.HTML}}</textarea>
  </form>
</div>
<script src="https://cdn.ckeditor.com/4.25.1-lts/full-all/ckeditor.js"></script>
<script>
function initializeEditor() {
  CKEDITOR.replace('editor', {
    height: '100%',
    removePlugins: 'elementspath',
    extraPlugins: 'save',
    toolbar: [
      { name: 'document', items: ['Save'] },
      { name: 'clipboard', items: ['Undo', 'Redo'] },
      { name: 'editing', items: ['Find', 'Replace'] },
      { name: 'basicstyles', items: ['Bold', 'Italic', 'Underline'] },
      { name: 'paragraph', items: ['NumberedList', 'BulletedList'] },
      { name: 'links', items: ['Link', 'Unlink'] },
      { name: 'insert', items: ['Image', 'Table'] },
      { name: 'styles', items: ['Format'] }
    ],
    on: {
      save: function(event) {
        event.cancel();
        document.getElementById('editorForm').submit();
      }
    }
  });
}
initializeEditor();
</script>
</body>
</html>
