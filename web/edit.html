<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit {{.Path}}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f8fc url('/p/static/bg.png') repeat; }
    .top-menu { background: linear-gradient(90deg,#244f9c,#3f7fe0); border-radius: 12px; }
    .top-menu a { color:#fff; text-decoration:none; padding:10px 14px; border-right:1px solid rgba(255,255,255,.2); display:flex; align-items:center; gap:8px; }
    .top-menu a:last-child { border-right:0; }
    .top-menu img { width:16px; }
  </style>
</head>
<body>
<div class="container py-4">
  <nav class="top-menu d-flex flex-wrap mb-4 shadow-sm overflow-hidden">
    <a href="/?edit"><img src="/p/static/pencil.png" alt="">Edit</a>
    <a href="{{.Path}}?revisions"><img src="/p/static/revisions.png" alt="">Revisions</a>
    <a href="/files"><img src="/p/static/upload.png" alt="">Files</a>
    <a href="/logout"><img src="/p/static/sign-out.png" alt="">Sign out</a>
  </nav>
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4">Edit {{.Path}}</h1>
      <form method="post" action="/save" class="vstack gap-3">
        <input type="hidden" name="path" value="{{.Path}}" />
        <input class="form-control" name="title" value="{{.Title}}" placeholder="Page title" />
        <textarea class="form-control" id="editor" name="html" rows="20">{{.HTML}}</textarea>
        <button class="btn btn-success"><img src="/p/static/apply.png" width="16" alt=""> Save page</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
<script>
function initializeEditor() { CKEDITOR.replace('editor'); }
initializeEditor();
</script>
</body>
</html>
