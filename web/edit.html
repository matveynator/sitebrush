<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{index .T "edit_title_prefix"}} {{.Path}}</title>
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #f4f8fc; font-family: Arial, sans-serif; }
    .editor-page { height: 100%; display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; }
    #visualEditorRoot { flex: 1; min-height: 75vh; }
    .action-bar { display:flex; justify-content:flex-end; gap:10px; padding-top:10px; }
    .save-button { background:#1ea74f; color:#fff; border:0; padding:10px 18px; border-radius:6px; cursor:pointer; }
    .cancel-button { background:#6c757d; color:#fff; text-decoration:none; padding:10px 18px; border-radius:6px; }
  </style>
</head>
<body>
<form id="visualEditorForm" method="post" action="/save" class="editor-page">
  <input type="hidden" name="path" value="{{.Path}}" />
  <input type="hidden" name="title" value="{{.Title}}" />
  <input type="hidden" id="htmlContentField" name="html" />
  <div id="visualEditorRoot"></div>
  <div class="action-bar">
    <a class="cancel-button" href="{{.Path}}">{{index .T "edit_cancel"}}</a>
    <button class="save-button" type="submit">{{index .T "edit_save"}}</button>
  </div>
</form>
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script>
const initialHtmlContent = {{printf "%q" .HTML}};

function createVisualHtmlEditor() {
  return new toastui.Editor({
    el: document.querySelector('#visualEditorRoot'),
    initialValue: initialHtmlContent,
    initialEditType: 'wysiwyg',
    previewStyle: 'vertical',
    height: '100%'
  });
}

function connectSavePipeline(visualHtmlEditor) {
  const visualEditorFormElement = document.getElementById('visualEditorForm');
  const htmlContentFieldElement = document.getElementById('htmlContentField');
  visualEditorFormElement.addEventListener('submit', function onSubmit() {
    htmlContentFieldElement.value = visualHtmlEditor.getHTML();
  });
}

const visualHtmlEditor = createVisualHtmlEditor();
connectSavePipeline(visualHtmlEditor);
</script>
</body>
</html>
