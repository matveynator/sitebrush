<!doctype html>
<html lang="en">
<head>
  <script>
  (function applySystemThemeMode() {
    const prefersDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-bs-theme', prefersDarkMode ? 'dark' : 'light');
  })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Revisions {{.Path}}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#eef4fb url('/p/static/bg.png') repeat}.revision-card{border-left:5px solid #2d6cdf}</style>
</head>
<body>
<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h4 mb-0"><a href="/" class="text-decoration-none">{{.Domain}}</a> · <img src="/p/static/revisions.png" width="18" alt=""> {{index .T "revisions_for"}} {{.Path}}</h1>
    <a class="btn btn-outline-primary" href="{{.ReturnPath}}"><img src="/p/static/arrow-left-up.png" width="16" alt=""> {{index .T "back_to_uri"}}</a>
  </div>
  {{range .Revisions}}
  <div class="card revision-card mb-3 shadow-sm border-0">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <strong>#{{.ID}}</strong><small class="text-secondary">{{.CreatedAt}}</small>
      </div>
      <div class="d-flex gap-2 mb-3">
        <form method="post" action="/revision/restore">
          <input type="hidden" name="id" value="{{.ID}}"/>
          <button class="btn btn-success btn-sm"><img src="/p/static/arrow_undo.png" width="14" alt=""> Restore</button>
        </form>
        <form method="post" action="/revision/delete">
          <input type="hidden" name="id" value="{{.ID}}"/>
          <input type="hidden" name="path" value="{{.PagePath}}"/>
          <button class="btn btn-danger btn-sm"><img src="/p/static/cross.png" width="14" alt=""> Delete</button>
        </form>
      </div>
      <pre class="bg-light p-3 rounded" style="white-space:pre-wrap">{{.HTML}}</pre>
    </div>
  </div>
  {{end}}
</div>
</body>
</html>
