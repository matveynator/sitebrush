<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{index .T "domain_settings_title"}}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 720px; }
    textarea { width: 100%; min-height: 140px; }
    .hint { color: #555; }
  </style>
</head>
<body>
  <h1>{{.Domain}} | {{index .T "domain_settings_title"}}</h1>
  <p><strong>{{index .T "domain_settings_primary"}}</strong> {{.Domain}}</p>
  <p class="hint">{{index .T "domain_settings_hint"}}</p>
  <form method="post" action="/domain/settings">
    <label for="aliases">{{index .T "domain_settings_aliases"}}</label><br>
    <textarea id="aliases" name="aliases" placeholder="example.net&#10;www.example.net">{{.Aliases}}</textarea><br><br>
    <button type="submit">{{index .T "domain_settings_save"}}</button>
  </form>
</body>
</html>
