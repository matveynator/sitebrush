<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raw edit {{.Path}}</title>
  <style>
    html, body { height:100%; margin:0; }
    body { font-family: Arial, sans-serif; }
    .raw-page { min-height:100%; display:flex; flex-direction:column; padding:10px; }
    .bar { display:flex; justify-content:space-between; margin-bottom:8px; }
    .save-button { background:#1ea74f; color:#fff; border:0; padding:10px 16px; border-radius:6px; cursor:pointer; }
    textarea { width:100%; flex:1; min-height:75vh; font-family: monospace; }
    .cancel-link { color:#1f3f6f; text-decoration:none; }
  </style>
</head>
<body>
<form method="post" action="/save" class="raw-page">
  <input type="hidden" name="path" value="{{.Path}}" />
  <input type="hidden" name="title" value="{{.Title}}" />
  <div class="bar"><button type="submit" class="save-button">Save</button><a class="cancel-link" href="{{.Path}}">Cancel</a></div>
  <textarea name="html">{{.HTML}}</textarea>
  <div class="bar"><button type="submit" class="save-button">Save</button><a class="cancel-link" href="{{.Path}}">Cancel</a></div>
</form>
</body>
</html>
