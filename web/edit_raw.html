<!doctype html>
<html lang="{{.LanguageCode}}" dir="{{.TextDirection}}">
<head>
  <script>
  (function applySystemThemeMode() {
    const prefersDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-bs-theme', prefersDarkMode ? 'dark' : 'light');
  })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{index .T "edit_raw_title_prefix"}} {{.Path}}</title>
  <link rel="stylesheet" href="/p/static/codemirror/codemirror.min.css" />
  <style>
    :root { color-scheme: light dark; --page-bg:#f4f8fc; --text-main:#1b2a3d; --panel:#ffffff; --panel-soft:#edf4fb; --field:#ffffff; --field-text:#12253f; --field-border:#b9c7db; --line:#d7e1ef; --link:#1a65d8; --disabled:#8b98aa; }
    @media (prefers-color-scheme: dark) { :root { --page-bg:#0f1724; --text-main:#dbe8ff; --panel:#172235; --panel-soft:#0f1a2b; --field:#0f1a2b; --field-text:#dbe8ff; --field-border:#334868; --line:#263a57; --link:#9ec2ff; --disabled:#71819b; } }
    html, body { height:100%; margin:0; overflow:hidden; }
    body { font-family: Arial, sans-serif; background: var(--page-bg); color: var(--text-main); }
    button, textarea { font:inherit; }
    .raw-page { height:100%; min-height:0; display:flex; flex-direction:column; box-sizing:border-box; }
    .raw-topbar { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
    .raw-tabs, .raw-actions, .raw-history { display:flex; align-items:center; gap:8px; }
    .raw-tab, .raw-history-button { border:1px solid var(--field-border); border-radius:6px; min-height:36px; padding:7px 11px; background:var(--panel-soft); color:var(--text-main); cursor:pointer; }
    .raw-tab.is-active { background:var(--link); border-color:var(--link); color:#fff; }
    .raw-history-button { min-width:38px; padding:7px 10px; font-size:18px; line-height:1; }
    .raw-history-button[disabled] { color:var(--disabled); cursor:default; opacity:.65; }
    .raw-body { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; padding:12px; box-sizing:border-box; overflow:hidden; }
    .document-kind { flex:0 0 auto; margin:0 0 8px 0; font-size:13px; color: var(--text-main); opacity:.75; }
    .raw-editor-pane, .raw-preview-pane { flex:1 1 auto; min-height:0; display:flex; }
    .raw-editor-pane[hidden], .raw-preview-pane[hidden] { display:none; }
    textarea { width:100%; flex:1 1 auto; min-height:0; resize:none; box-sizing:border-box; padding:10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--field); color: var(--field-text); border: 1px solid var(--field-border); border-radius:6px; line-height:1.45; }
    .CodeMirror { flex:1 1 auto; width:100%; height:auto; min-height:0; box-sizing:border-box; border:1px solid var(--field-border); border-radius:6px; background:var(--field); color:var(--field-text); font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:14px; line-height:1.45; }
    .CodeMirror-scroll { min-height:100%; }
    .CodeMirror-gutters { background:var(--panel-soft); border-color:var(--field-border); }
    .CodeMirror-linenumber { color:var(--disabled); }
    .CodeMirror-cursor { border-left-color:var(--field-text); }
    .CodeMirror-selected { background:rgba(26,101,216,.22); }
    .cm-s-default .cm-tag { color:#12702a; }
    .cm-s-default .cm-attribute { color:#1a65d8; }
    .cm-s-default .cm-string { color:#a33b00; }
    .cm-s-default .cm-keyword { color:#7c3aed; }
    .cm-s-default .cm-comment { color:#777; }
    @media (prefers-color-scheme: dark) {
      .cm-s-default .cm-tag { color:#7ee787; }
      .cm-s-default .cm-attribute { color:#9ec2ff; }
      .cm-s-default .cm-string { color:#ffa657; }
      .cm-s-default .cm-keyword { color:#d2a8ff; }
      .cm-s-default .cm-comment { color:#8b949e; }
    }
    .raw-preview-frame { width:100%; height:100%; border:1px solid var(--field-border); border-radius:6px; background:var(--field); box-sizing:border-box; }
    .action-bar { flex:0 0 auto; display:flex; justify-content:flex-end; gap:10px; padding:10px 12px; border-top:1px solid var(--line); background:var(--panel); }
    .save-button { background:#1ea74f; color:#fff; border:0; padding:10px 18px; border-radius:6px; cursor:pointer; }
    .cancel-button { background:#6c757d; color:#fff; text-decoration:none; padding:10px 18px; border-radius:6px; }
    @media (max-width: 700px) {
      .raw-topbar { align-items:stretch; flex-direction:column; }
      .raw-tabs, .raw-actions { width:100%; }
      .raw-tab { flex:1 1 0; }
      .raw-history { margin-left:auto; }
    }
  </style>
</head>
<body>
<form id="rawEditorForm" method="post" action="{{.Path}}?save" class="raw-page">
  <input type="hidden" name="path" value="{{.Path}}" />
  <input type="hidden" name="previous_path" value="{{.Path}}" />
  <input type="hidden" name="title" value="{{.Title}}" />
  <div class="raw-topbar">
    <div class="raw-tabs" role="tablist" aria-label="{{index .T "edit_view_tabs_label"}}">
      <button id="rawEditorEditTab" class="raw-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="rawEditorPane">{{index .T "edit_view_editor"}}</button>
      <button id="rawEditorPreviewTab" class="raw-tab" type="button" role="tab" aria-selected="false" aria-controls="rawPreviewPane">{{index .T "edit_view_preview"}}</button>
    </div>
    <div class="raw-actions">
      <div class="raw-history" aria-label="{{index .T "edit_history_controls_label"}}">
        <button id="rawUndoButton" class="raw-history-button" type="button" title="{{index .T "edit_undo"}}" aria-label="{{index .T "edit_undo"}}">&larr;</button>
        <button id="rawRedoButton" class="raw-history-button" type="button" title="{{index .T "edit_redo"}}" aria-label="{{index .T "edit_redo"}}">&rarr;</button>
      </div>
    </div>
  </div>
  <div class="raw-body">
    <p class="document-kind">Document type: {{.ContentKind}}</p>
    <div id="rawEditorPane" class="raw-editor-pane">
      <textarea id="rawEditorTextArea" name="html" spellcheck="false">{{.HTML}}</textarea>
    </div>
    <div id="rawPreviewPane" class="raw-preview-pane" hidden>
      <iframe id="rawPreviewFrame" class="raw-preview-frame" title="{{index .T "edit_view_preview"}}"></iframe>
    </div>
  </div>
  <div class="action-bar">
    <a class="cancel-button" href="{{.Path}}">{{index .T "edit_cancel"}}</a>
    <button type="submit" class="save-button">{{index .T "edit_save"}}</button>
  </div>
</form>
<script src="/p/static/codemirror/codemirror.min.js"></script>
<script src="/p/static/codemirror/xml.min.js"></script>
<script src="/p/static/codemirror/css.min.js"></script>
<script src="/p/static/codemirror/javascript.min.js"></script>
<script src="/p/static/codemirror/htmlmixed.min.js"></script>
<script>
const rawEditorState = {
  view: 'edit',
  history: [],
  historyIndex: -1,
  applyingHistory: false,
  historyTimer: 0,
  previewTimer: 0,
  codeMirror: null
};
const rawEditorFormElement = document.getElementById('rawEditorForm');
const rawEditorTextAreaElement = document.getElementById('rawEditorTextArea');
const rawEditorEditTabElement = document.getElementById('rawEditorEditTab');
const rawEditorPreviewTabElement = document.getElementById('rawEditorPreviewTab');
const rawEditorPaneElement = document.getElementById('rawEditorPane');
const rawPreviewPaneElement = document.getElementById('rawPreviewPane');
const rawPreviewFrameElement = document.getElementById('rawPreviewFrame');
const rawUndoButtonElement = document.getElementById('rawUndoButton');
const rawRedoButtonElement = document.getElementById('rawRedoButton');
const rawEditorPagePath = {{.Path}};
const rawEditorContentKind = {{.ContentKind}};

function rawEditorModeName() {
  const normalizedPagePath = String(rawEditorPagePath || '').toLowerCase();
  if (rawEditorContentKind === 'HTML page') {
    return 'htmlmixed';
  }
  if (normalizedPagePath.endsWith('.css')) {
    return 'css';
  }
  if (normalizedPagePath.endsWith('.js') || normalizedPagePath.endsWith('.mjs')) {
    return 'javascript';
  }
  if (normalizedPagePath.endsWith('.xml') || normalizedPagePath.endsWith('.svg')) {
    return 'xml';
  }
  if (normalizedPagePath.endsWith('.json')) {
    return {name: 'javascript', json: true};
  }
  return 'htmlmixed';
}

function rawEditorCurrentText() {
  if (rawEditorState.codeMirror) {
    return rawEditorState.codeMirror.getValue();
  }
  return rawEditorTextAreaElement.value;
}

function saveRawEditorTextAreaValue() {
  if (rawEditorState.codeMirror) {
    rawEditorState.codeMirror.save();
  }
}

function setRawEditorText(nextText) {
  if (rawEditorState.codeMirror) {
    rawEditorState.codeMirror.setValue(nextText);
    saveRawEditorTextAreaValue();
    return;
  }
  rawEditorTextAreaElement.value = nextText;
}

function refreshRawEditorCodeMirror() {
  if (!rawEditorState.codeMirror) {
    return;
  }
  rawEditorState.codeMirror.refresh();
  rawEditorState.codeMirror.focus();
}

function initializeRawEditorCodeMirror() {
  if (!window.CodeMirror) {
    return;
  }
  rawEditorState.codeMirror = window.CodeMirror.fromTextArea(rawEditorTextAreaElement, {
    mode: rawEditorModeName(),
    lineNumbers: true,
    lineWrapping: true,
    smartIndent: true,
    electricChars: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    viewportMargin: 100,
    extraKeys: {
      Tab: function indentRawEditorSelection(codeMirrorEditor) {
        if (codeMirrorEditor.somethingSelected()) {
          codeMirrorEditor.indentSelection('add');
          return;
        }
        codeMirrorEditor.replaceSelection(codeMirrorEditor.getOption('indentWithTabs') ? '\t' : Array(codeMirrorEditor.getOption('indentUnit') + 1).join(' '), 'end', '+input');
      },
      'Shift-Tab': function unindentRawEditorSelection(codeMirrorEditor) {
        codeMirrorEditor.indentSelection('subtract');
      },
      Enter: 'newlineAndIndent'
    }
  });
  rawEditorState.codeMirror.on('change', function onRawEditorCodeMirrorChange() {
    saveRawEditorTextAreaValue();
    scheduleRawEditorHistoryPush();
    scheduleRawEditorPreviewRefresh();
  });
}

function rawEditorBaseURL() {
  return new URL(rawEditorPagePath || '/', window.location.href).href;
}

function escapeRawEditorHTML(textValue) {
  return String(textValue || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function rawEditorPreviewHTML(sourceText) {
  const baseElement = '<base href="' + rawEditorBaseURL().replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '">';
  if (rawEditorContentKind === 'HTML page') {
    if (/<(html|head|body)(\s|>)/i.test(sourceText || '')) {
      return String(sourceText || '').replace(/<head(\s[^>]*)?>/i, function addBaseToHead(headOpenTag) {
        return headOpenTag + baseElement;
      });
    }
    return '<!doctype html><html><head>' + baseElement + '</head><body>' + String(sourceText || '') + '</body></html>';
  }
  return '<!doctype html><html><head>' + baseElement + '<style>html,body{margin:0;min-height:100%;box-sizing:border-box;background:Canvas;color:CanvasText;}body{padding:12px;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;}</style></head><body>' + escapeRawEditorHTML(sourceText) + '</body></html>';
}

function refreshRawEditorPreview() {
  saveRawEditorTextAreaValue();
  rawPreviewFrameElement.srcdoc = rawEditorPreviewHTML(rawEditorCurrentText());
}

function scheduleRawEditorPreviewRefresh() {
  if (rawEditorState.view !== 'preview') {
    return;
  }
  window.clearTimeout(rawEditorState.previewTimer);
  rawEditorState.previewTimer = window.setTimeout(refreshRawEditorPreview, 120);
}

function setRawEditorView(nextViewName) {
  const normalizedViewName = nextViewName === 'preview' ? 'preview' : 'edit';
  rawEditorState.view = normalizedViewName;
  rawEditorEditTabElement.classList.toggle('is-active', normalizedViewName === 'edit');
  rawEditorPreviewTabElement.classList.toggle('is-active', normalizedViewName === 'preview');
  rawEditorEditTabElement.setAttribute('aria-selected', normalizedViewName === 'edit' ? 'true' : 'false');
  rawEditorPreviewTabElement.setAttribute('aria-selected', normalizedViewName === 'preview' ? 'true' : 'false');
  rawEditorPaneElement.hidden = normalizedViewName !== 'edit';
  rawPreviewPaneElement.hidden = normalizedViewName !== 'preview';
  if (normalizedViewName === 'preview') {
    pushRawEditorHistory(rawEditorCurrentText());
    refreshRawEditorPreview();
    return;
  }
  window.setTimeout(refreshRawEditorCodeMirror, 0);
}

function updateRawHistoryButtons() {
  rawUndoButtonElement.disabled = rawEditorState.historyIndex <= 0;
  rawRedoButtonElement.disabled = rawEditorState.historyIndex >= rawEditorState.history.length - 1;
}

function pushRawEditorHistory(nextValue) {
  const currentValue = String(nextValue || '');
  if (rawEditorState.history[rawEditorState.historyIndex] === currentValue) {
    updateRawHistoryButtons();
    return;
  }
  rawEditorState.history = rawEditorState.history.slice(0, rawEditorState.historyIndex + 1);
  rawEditorState.history.push(currentValue);
  if (rawEditorState.history.length > 200) {
    rawEditorState.history.shift();
  }
  rawEditorState.historyIndex = rawEditorState.history.length - 1;
  updateRawHistoryButtons();
}

function scheduleRawEditorHistoryPush() {
  if (rawEditorState.applyingHistory) {
    return;
  }
  window.clearTimeout(rawEditorState.historyTimer);
  rawEditorState.historyTimer = window.setTimeout(function pushCurrentDraft() {
    pushRawEditorHistory(rawEditorCurrentText());
  }, 350);
}

function applyRawEditorHistoryValue(historyValue) {
  rawEditorState.applyingHistory = true;
  setRawEditorText(historyValue);
  rawEditorState.applyingHistory = false;
  updateRawHistoryButtons();
  scheduleRawEditorPreviewRefresh();
}

function undoRawEditorDraft() {
  pushRawEditorHistory(rawEditorCurrentText());
  if (rawEditorState.historyIndex <= 0) {
    return;
  }
  rawEditorState.historyIndex -= 1;
  applyRawEditorHistoryValue(rawEditorState.history[rawEditorState.historyIndex]);
}

function redoRawEditorDraft() {
  if (rawEditorState.historyIndex >= rawEditorState.history.length - 1) {
    return;
  }
  rawEditorState.historyIndex += 1;
  applyRawEditorHistoryValue(rawEditorState.history[rawEditorState.historyIndex]);
}

rawEditorEditTabElement.addEventListener('click', function onRawEditTabClick() {
  setRawEditorView('edit');
});
rawEditorPreviewTabElement.addEventListener('click', function onRawPreviewTabClick() {
  setRawEditorView('preview');
});
rawUndoButtonElement.addEventListener('click', undoRawEditorDraft);
rawRedoButtonElement.addEventListener('click', redoRawEditorDraft);
rawEditorTextAreaElement.addEventListener('input', function onRawEditorInput() {
  scheduleRawEditorHistoryPush();
  scheduleRawEditorPreviewRefresh();
});
rawEditorTextAreaElement.addEventListener('keydown', function onRawEditorKeyDown(keyboardEvent) {
  const pressedCtrlOrMeta = keyboardEvent.ctrlKey || keyboardEvent.metaKey;
  if (!pressedCtrlOrMeta) {
    return;
  }
  const keyName = String(keyboardEvent.key || '').toLowerCase();
  if (keyName === 'z' && !keyboardEvent.shiftKey) {
    keyboardEvent.preventDefault();
    undoRawEditorDraft();
  } else if (keyName === 'y' || (keyName === 'z' && keyboardEvent.shiftKey)) {
    keyboardEvent.preventDefault();
    redoRawEditorDraft();
  }
});
rawEditorFormElement.addEventListener('submit', function onRawEditorSubmit() {
  saveRawEditorTextAreaValue();
  pushRawEditorHistory(rawEditorCurrentText());
});
initializeRawEditorCodeMirror();
pushRawEditorHistory(rawEditorCurrentText());
setRawEditorView('edit');
</script>
</body>
</html>
