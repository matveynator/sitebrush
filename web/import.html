<!doctype html>
<html lang="{{.LanguageCode}}" dir="{{.TextDirection}}">
<head>
  <script>
  (function applySystemThemeMode() {
    const prefersDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-bs-theme', prefersDarkMode ? 'dark' : 'light');
  })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{index .T "import_page_title"}}</title>
  <link rel="stylesheet" href="/p/static/technical_pages.css">
</head>
<body class="technical-page bg-body">
<main class="container authentication-shell import-page">
  <header class="page-header">
    <h1 class="section-heading"><img src="/p/static/copy.png" class="section-icon" alt=""><span>{{index .T "import_page_title"}}</span></h1>
  </header>
  <form class="card card-body authentication-card edit-mode-copy-form" method="post" action="?import">
    <input class="form-control" type="url" inputmode="url" name="url" placeholder="https://example.com" required>
    <input class="form-control" type="text" inputmode="numeric" name="source_ip" placeholder="{{index .T "import_source_ip_placeholder"}}">
    <input class="form-control" type="text" name="path" placeholder="/imported">
    <button class="btn btn-primary" type="submit"><img src="/p/static/copy.png" alt="">{{index .T "import_button"}}</button>
  </form>
</main>
</body>
</html>
