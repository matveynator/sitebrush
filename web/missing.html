<!doctype html>
<html lang="ru" id="SiteBrush">
<head>
  <script>
  (function applySystemThemeMode() {
    const prefersDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-bs-theme', prefersDarkMode ? 'dark' : 'light');
  })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ошибка 404: страница не найдена.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body">
<div class="container py-5">
  <div class="page-header mb-4">
    <h1><a href="/">{{.Domain}}</a> <small class="text-muted">| Ошибка 404: страница не найдена.</small></h1>
  </div>

  <div class="alert {{if .IsAdmin}}alert-success{{else}}alert-info{{end}}" role="alert">
    Страница <strong>{{.Path}}</strong> не найдена. Пожалуйста <a class="alert-link" href="{{if .EditLink}}{{.EditLink}}{{else}}{{.Path}}?edit{{end}}">создайте эту страницу</a>.
  </div>

  {{if .IsAdmin}}
  <form class="card card-body mt-3" method="post" action="{{.Path}}?grab" data-grab-form style="max-width:680px;">
    <input type="hidden" name="path" value="{{.Path}}">
    <input type="hidden" name="progress_token" id="progress_token" value="">
    <label class="form-label" for="source_url">Или скопируйте страницу с другого сайта:</label>
    <div class="input-group">
      <input id="source_url" name="source_url" type="text" inputmode="url" autocomplete="url" class="form-control" placeholder="sitebrush.com или https://example.com/page" required>
      <button type="submit" class="btn btn-success">Скопировать</button>
    </div>
  </form>
  <div class="modal fade" id="grabProgressModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header">
      <h5 class="modal-title" id="grab_modal_title">Загрузка страницы</h5>
      <button type="button" class="btn-close d-none" id="grab_modal_header_close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
    </div><div class="modal-body">
      <p id="grab_progress_text">Подготовка...</p>
      <div class="progress" id="grab_progress_holder"><div class="progress-bar" id="grab_progress_bar" role="progressbar" style="width:0%;">0%</div></div>
      <small id="grab_progress_url" class="text-muted d-block mt-2"></small>
      <div id="grab_resource_list" class="list-group small mt-3 d-none" style="max-height:260px;overflow:auto;"></div>
    </div><div class="modal-footer">
      <button type="button" class="btn btn-outline-secondary" id="grab_cancel_button" data-bs-dismiss="modal">Отмена</button>
      <button type="button" class="btn btn-success" id="grab_continue_button">Продолжить</button>
      <button type="button" class="btn btn-primary d-none" id="grab_close_button" data-bs-dismiss="modal">Закрыть</button>
    </div></div></div>
  </div>
  {{end}}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function setupGrabProgress() {
  const grabFormElement = document.querySelector('[data-grab-form]');
  if (!grabFormElement) { return; }
  const tokenFieldElement = document.getElementById('progress_token');
  const sourceUrlElement = document.getElementById('source_url');
  const submitButtonElement = grabFormElement.querySelector('button[type="submit"]');
  const modalTitleElement = document.getElementById('grab_modal_title');
  const progressTextElement = document.getElementById('grab_progress_text');
  const progressHolderElement = document.getElementById('grab_progress_holder');
  const progressBarElement = document.getElementById('grab_progress_bar');
  const progressUrlElement = document.getElementById('grab_progress_url');
  const resourceListElement = document.getElementById('grab_resource_list');
  const progressModalElement = document.getElementById('grabProgressModal');
  const headerCloseButtonElement = document.getElementById('grab_modal_header_close');
  const cancelButtonElement = document.getElementById('grab_cancel_button');
  const continueButtonElement = document.getElementById('grab_continue_button');
  const closeButtonElement = document.getElementById('grab_close_button');
  const progressModalController = new bootstrap.Modal(progressModalElement, { backdrop: 'static', keyboard: false });

  let progressSocket = null;
  let confirmedSubmitStarted = false;
  let previewSelectAllElement = null;
  let downloadFinished = false;
  let downloadRedirectURL = '';

  function finishDownloadIfReady() {
    if (!downloadFinished || downloadRedirectURL === '') { return; }
    window.location.href = downloadRedirectURL;
  }

  function setModalClosable(closable) {
    headerCloseButtonElement.classList.toggle('d-none', !closable);
    closeButtonElement.classList.toggle('d-none', !closable);
  }

  function setProgressPercent(percentNumber) {
    const boundedPercent = Math.max(0, Math.min(100, Number(percentNumber) || 0));
    progressBarElement.style.width = boundedPercent + '%';
    progressBarElement.textContent = boundedPercent + '%';
    progressBarElement.setAttribute('aria-valuenow', String(boundedPercent));
  }

  function clearResourceList() {
    resourceListElement.replaceChildren();
    resourceListElement.classList.add('d-none');
    previewSelectAllElement = null;
  }

  function formatResourceSize(sizeBytes) {
    const normalizedSize = Number(sizeBytes);
    if (!Number.isFinite(normalizedSize) || normalizedSize < 0) { return 'размер неизвестен'; }
    if (normalizedSize < 1024) { return normalizedSize + ' B'; }
    if (normalizedSize < 1024 * 1024) { return (normalizedSize / 1024).toFixed(1) + ' KB'; }
    return (normalizedSize / 1024 / 1024).toFixed(1) + ' MB';
  }

  function syncSelectedResourceFields() {
    for (const selectedResourceElement of grabFormElement.querySelectorAll('input[name="import_resource_url"], input[name="import_selection_confirmed"]')) {
      selectedResourceElement.remove();
    }
    const confirmedSelectionElement = document.createElement('input');
    confirmedSelectionElement.type = 'hidden';
    confirmedSelectionElement.name = 'import_selection_confirmed';
    confirmedSelectionElement.value = '1';
    grabFormElement.appendChild(confirmedSelectionElement);
    for (const checkboxElement of resourceListElement.querySelectorAll('input[data-grab-resource-url]')) {
      if (!checkboxElement.checked) { continue; }
      const selectedResourceElement = document.createElement('input');
      selectedResourceElement.type = 'hidden';
      selectedResourceElement.name = 'import_resource_url';
      selectedResourceElement.value = checkboxElement.dataset.grabResourceUrl || '';
      grabFormElement.appendChild(selectedResourceElement);
    }
  }

  function updatePreviewSelectAllState() {
    if (!previewSelectAllElement) { return; }
    const checkboxElements = Array.from(resourceListElement.querySelectorAll('input[data-grab-resource-url]'));
    const checkedCount = checkboxElements.filter(function countChecked(checkboxElement) { return checkboxElement.checked; }).length;
    previewSelectAllElement.checked = checkboxElements.length > 0 && checkedCount === checkboxElements.length;
    previewSelectAllElement.indeterminate = checkedCount > 0 && checkedCount < checkboxElements.length;
  }

  function findResourceRow(resourceURL) {
    for (const resourceRowElement of resourceListElement.querySelectorAll('[data-grab-resource-row-url]')) {
      if (resourceRowElement.dataset.grabResourceRowUrl === resourceURL) {
        return resourceRowElement;
      }
    }
    return null;
  }

  function setResourceRowProgress(resourceRowElement, percentNumber, statusText) {
    const boundedPercent = Math.max(0, Math.min(100, Number(percentNumber) || 0));
    const progressElement = resourceRowElement.querySelector('[data-grab-resource-progress]');
    const progressBarElement = resourceRowElement.querySelector('[data-grab-resource-progress-bar]');
    const statusElement = resourceRowElement.querySelector('[data-grab-resource-status]');
    if (progressElement) { progressElement.classList.remove('d-none'); }
    if (progressBarElement) {
      progressBarElement.style.width = boundedPercent + '%';
      progressBarElement.textContent = boundedPercent + '%';
      progressBarElement.setAttribute('aria-valuenow', String(boundedPercent));
    }
    if (statusElement) { statusElement.textContent = statusText; }
  }

  function describeDownloadProgress(progressState) {
    const currentPercent = Number(progressState.current_percent) || 0;
    const downloadedBytes = Number(progressState.current_downloaded_bytes) || 0;
    const sizeBytes = Number(progressState.current_size_bytes);
    if (progressState.stage === 'found') { return 'Ожидает скачивания'; }
    if (progressState.stage === 'downloaded') { return 'Скачано локально'; }
    if (progressState.stage === 'error') { return 'Ошибка скачивания, оставлен внешний URL'; }
    if (Number.isFinite(sizeBytes) && sizeBytes > 0) {
      return 'Скачано ' + formatResourceSize(downloadedBytes) + ' из ' + formatResourceSize(sizeBytes) + ' (' + currentPercent + '%)';
    }
    if (downloadedBytes > 0) {
      return 'Скачано ' + formatResourceSize(downloadedBytes);
    }
    return 'Скачивание...';
  }

  function appendProgressOnlyResource(resourceURL) {
    appendPreviewResource({ url: resourceURL, kind: 'file', size_bytes: -1 });
    const resourceRowElement = findResourceRow(resourceURL);
    if (!resourceRowElement) { return null; }
    const checkboxElement = resourceRowElement.querySelector('input[data-grab-resource-url]');
    if (checkboxElement) {
      checkboxElement.checked = true;
      checkboxElement.disabled = true;
    }
    return resourceRowElement;
  }

  function updateResourceDownloadProgress(progressState) {
    const resourceURL = progressState.current_url || '';
    if (!resourceURL) { return; }
    let resourceRowElement = findResourceRow(resourceURL);
    if (!resourceRowElement) {
      resourceRowElement = appendProgressOnlyResource(resourceURL);
    }
    if (!resourceRowElement) { return; }
    const resourcePercent = progressState.stage === 'downloaded' ? 100 : Number(progressState.current_percent) || 0;
    setResourceRowProgress(resourceRowElement, resourcePercent, describeDownloadProgress(progressState));
  }

  function prepareResourceRowsForDownload() {
    if (previewSelectAllElement && previewSelectAllElement.parentElement) {
      previewSelectAllElement.parentElement.remove();
      previewSelectAllElement = null;
    }
    const resourceRowElements = resourceListElement.querySelectorAll('[data-grab-resource-row-url]');
    if (resourceRowElements.length > 0) {
      resourceListElement.classList.remove('d-none');
    }
    for (const resourceRowElement of resourceRowElements) {
      const checkboxElement = resourceRowElement.querySelector('input[data-grab-resource-url]');
      if (!checkboxElement) { continue; }
      checkboxElement.disabled = true;
      if (!checkboxElement.checked) {
        resourceRowElement.classList.add('opacity-75');
        const statusElement = resourceRowElement.querySelector('[data-grab-resource-status]');
        if (statusElement) { statusElement.textContent = 'Оставлен внешний URL'; }
        continue;
      }
      setResourceRowProgress(resourceRowElement, 0, 'Ожидает скачивания');
    }
  }

  function showPreviewLoading() {
    modalTitleElement.textContent = 'Проверка ресурсов';
    progressTextElement.textContent = 'Смотрим, какие ресурсы есть на странице...';
    progressHolderElement.classList.add('d-none');
    progressUrlElement.textContent = sourceUrlElement.value;
    clearResourceList();
    setModalClosable(false);
    cancelButtonElement.classList.remove('d-none');
    continueButtonElement.classList.add('d-none');
    progressModalController.show();
  }

  function showPreviewError(previewError) {
    modalTitleElement.textContent = 'Ошибка проверки';
    progressTextElement.textContent = previewError.message || 'Не удалось проверить ресурсы страницы.';
    progressHolderElement.classList.add('d-none');
    progressUrlElement.textContent = sourceUrlElement.value;
    clearResourceList();
    setModalClosable(true);
    cancelButtonElement.classList.add('d-none');
    continueButtonElement.classList.add('d-none');
    if (submitButtonElement) { submitButtonElement.disabled = false; }
  }

  function appendPreviewResource(previewResource) {
    const resourceRowElement = document.createElement('div');
    resourceRowElement.className = 'list-group-item d-flex gap-2 align-items-start';
    resourceRowElement.dataset.grabResourceRowUrl = previewResource.url || '';
    const checkboxElement = document.createElement('input');
    checkboxElement.className = 'form-check-input flex-shrink-0 mt-1';
    checkboxElement.type = 'checkbox';
    checkboxElement.checked = true;
    checkboxElement.dataset.grabResourceUrl = previewResource.url || '';
    checkboxElement.addEventListener('change', updatePreviewSelectAllState);
    const kindElement = document.createElement('span');
    kindElement.className = 'badge text-bg-secondary flex-shrink-0';
    kindElement.textContent = previewResource.kind || 'file';
    const detailsElement = document.createElement('div');
    detailsElement.className = 'flex-grow-1';
    const urlElement = document.createElement('div');
    urlElement.className = 'text-break';
    urlElement.textContent = previewResource.url;
    const sizeElement = document.createElement('div');
    sizeElement.className = 'text-muted';
    sizeElement.textContent = formatResourceSize(previewResource.size_bytes);
    sizeElement.dataset.grabResourceStatus = '1';
    const rowProgressElement = document.createElement('div');
    rowProgressElement.className = 'progress mt-2 d-none';
    rowProgressElement.style.height = '18px';
    rowProgressElement.dataset.grabResourceProgress = '1';
    const rowProgressBarElement = document.createElement('div');
    rowProgressBarElement.className = 'progress-bar';
    rowProgressBarElement.style.width = '0%';
    rowProgressBarElement.textContent = '0%';
    rowProgressBarElement.setAttribute('role', 'progressbar');
    rowProgressBarElement.setAttribute('aria-valuemin', '0');
    rowProgressBarElement.setAttribute('aria-valuemax', '100');
    rowProgressBarElement.setAttribute('aria-valuenow', '0');
    rowProgressBarElement.dataset.grabResourceProgressBar = '1';
    rowProgressElement.appendChild(rowProgressBarElement);
    detailsElement.appendChild(urlElement);
    detailsElement.appendChild(sizeElement);
    detailsElement.appendChild(rowProgressElement);
    resourceRowElement.appendChild(checkboxElement);
    resourceRowElement.appendChild(kindElement);
    resourceRowElement.appendChild(detailsElement);
    resourceListElement.appendChild(resourceRowElement);
  }

  function appendPreviewSelectAll() {
    const selectAllRowElement = document.createElement('label');
    selectAllRowElement.className = 'list-group-item d-flex gap-2 align-items-center';
    previewSelectAllElement = document.createElement('input');
    previewSelectAllElement.className = 'form-check-input';
    previewSelectAllElement.type = 'checkbox';
    previewSelectAllElement.checked = true;
    const labelElement = document.createElement('span');
    labelElement.textContent = 'Импортировать все ресурсы локально';
    previewSelectAllElement.addEventListener('change', function onSelectAllChange() {
      for (const checkboxElement of resourceListElement.querySelectorAll('input[data-grab-resource-url]')) {
        checkboxElement.checked = previewSelectAllElement.checked;
      }
      updatePreviewSelectAllState();
    });
    selectAllRowElement.appendChild(previewSelectAllElement);
    selectAllRowElement.appendChild(labelElement);
    resourceListElement.appendChild(selectAllRowElement);
  }

  function showResourcePreview(previewPayload) {
    modalTitleElement.textContent = 'Подтвердите загрузку';
    progressHolderElement.classList.add('d-none');
    const resourceCount = Number(previewPayload.resource_count) || 0;
    progressTextElement.textContent = 'HTML страницы будет импортирован. Отмеченные ресурсы будут скачаны локально, снятые останутся внешними ссылками: ' + resourceCount + '.';
    progressUrlElement.textContent = previewPayload.source_url || sourceUrlElement.value;
    clearResourceList();
    if (resourceCount > 0) {
      resourceListElement.classList.remove('d-none');
      appendPreviewSelectAll();
      for (const previewResource of previewPayload.resources || []) {
        appendPreviewResource(previewResource);
      }
      updatePreviewSelectAllState();
    }
    setModalClosable(true);
    cancelButtonElement.classList.remove('d-none');
    continueButtonElement.classList.remove('d-none');
    if (submitButtonElement) { submitButtonElement.disabled = false; }
  }

  function showDownloadProgress() {
    modalTitleElement.textContent = 'Загрузка страницы';
    progressTextElement.textContent = 'Начинаем загрузку...';
    progressHolderElement.classList.remove('d-none');
    progressUrlElement.textContent = '';
    prepareResourceRowsForDownload();
    setProgressPercent(0);
    setModalClosable(false);
    cancelButtonElement.classList.add('d-none');
    continueButtonElement.classList.add('d-none');
    downloadFinished = false;
    downloadRedirectURL = '';
  }

  function showDownloadError(errorText) {
    modalTitleElement.textContent = 'Ошибка загрузки';
    progressTextElement.textContent = errorText;
    setModalClosable(true);
    cancelButtonElement.classList.add('d-none');
    continueButtonElement.classList.add('d-none');
    if (submitButtonElement) { submitButtonElement.disabled = false; }
  }

  function connectProgressSocket(progressToken, readyCallback) {
    let readyCallbackWasCalled = false;
    const socketProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    progressSocket = new WebSocket(socketProtocol + '//' + window.location.host + {{printf "%q" .Path}} + '?grab_ws&token=' + encodeURIComponent(progressToken));
    progressSocket.onmessage = function onSocketMessage(messageEvent) {
      let progressState = null;
      try {
        progressState = JSON.parse(messageEvent.data);
      } catch (parseError) {
        showDownloadError('Сервер прислал некорректный статус загрузки.');
        progressSocket.close();
        return;
      }
      if (progressState.stage === 'ready') {
        if (!readyCallbackWasCalled) {
          readyCallbackWasCalled = true;
          readyCallback();
        }
        return;
      }
      const foundTotal = Number(progressState.found_total) || 0;
      const downloadedTotal = Number(progressState.downloaded_total) || 0;
      const remainingTotal = Math.max(foundTotal - downloadedTotal, 0);
      const completedPercent = Number(progressState.completed_percent) || 0;
      const remainingPercent = Math.max(100 - completedPercent, 0);
      updateResourceDownloadProgress(progressState);
      setProgressPercent(completedPercent);
      progressTextElement.textContent = 'Скачано: ' + downloadedTotal + ' из ' + foundTotal + ' (' + completedPercent + '%). Осталось: ' + remainingTotal + ' (' + remainingPercent + '%).';
      progressUrlElement.textContent = progressState.current_url || '';
      if (progressState.stage === 'done') {
        downloadFinished = true;
        setProgressPercent(100);
        progressTextElement.textContent = 'Готово. Открываем редактор...';
        progressSocket.close();
        finishDownloadIfReady();
      }
      if (progressState.stage === 'error' && !progressState.current_url) {
        showDownloadError('Не удалось скачать страницу. Окно можно закрыть и попробовать другой адрес.');
        progressSocket.close();
      }
    };
    progressSocket.onerror = function onSocketError() {
      if (downloadFinished) { return; }
      showDownloadError('Потеряно соединение со статусом загрузки. Окно можно закрыть.');
    };
  }

  function submitGrabRequest() {
    fetch({{printf "%q" .Path}} + '?grab', { method: 'POST', body: new FormData(grabFormElement), headers: { 'Accept': 'application/json' } })
      .then(function handleGrabHTTPResponse(grabHTTPResponse) {
        if (!grabHTTPResponse.ok) {
          return grabHTTPResponse.text().then(function throwGrabHTTPError(errorText) {
            throw new Error(errorText || 'Не удалось загрузить страницу.');
          });
        }
        return grabHTTPResponse.json();
      })
      .then(function handleGrabPayload(grabPayload) {
        downloadRedirectURL = grabPayload.redirect || (grabFormElement.querySelector('input[name="path"]').value + '?edit');
        finishDownloadIfReady();
      })
      .catch(function handleGrabFailure(grabError) {
        showDownloadError(grabError.message || 'Не удалось загрузить страницу.');
        if (progressSocket) { progressSocket.close(); }
      });
  }

  function startConfirmedDownload() {
    const progressToken = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    tokenFieldElement.value = progressToken;
    syncSelectedResourceFields();
    showDownloadProgress();
    connectProgressSocket(progressToken, function submitGrabFormAfterProgressReady() {
      confirmedSubmitStarted = true;
      submitGrabRequest();
    });
  }

  function requestGrabPreview() {
    showPreviewLoading();
    if (submitButtonElement) { submitButtonElement.disabled = true; }
    const previewRequestBody = new FormData(grabFormElement);
    fetch({{printf "%q" .Path}} + '?grab_preview', { method: 'POST', body: previewRequestBody, headers: { 'Accept': 'application/json' } })
      .then(function handlePreviewHTTPResponse(previewHTTPResponse) {
        if (!previewHTTPResponse.ok) {
          return previewHTTPResponse.text().then(function throwPreviewHTTPError(errorText) {
            throw new Error(errorText || 'Не удалось проверить ресурсы страницы.');
          });
        }
        return previewHTTPResponse.json();
      })
      .then(function handlePreviewPayload(previewPayload) {
        showResourcePreview(previewPayload);
      })
      .catch(function handlePreviewFailure(previewError) {
        showPreviewError(previewError);
      });
  }

  continueButtonElement.addEventListener('click', function onContinueClick() {
    startConfirmedDownload();
  });

  progressModalElement.addEventListener('hidden.bs.modal', function onProgressModalHidden() {
    if (progressSocket) {
      progressSocket.close();
      progressSocket = null;
    }
  });

  grabFormElement.addEventListener('submit', function onGrabSubmit(submitEvent) {
    if (confirmedSubmitStarted) { return; }
    submitEvent.preventDefault();
    if (!grabFormElement.checkValidity()) {
      grabFormElement.reportValidity();
      return;
    }
    requestGrabPreview();
  });
})();
</script>
</body>
</html>
