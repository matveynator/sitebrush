<!doctype html>
<html lang="ru" id="SiteBrush">
<head>
  <script>
  (function applySystemThemeMode() {
    const prefersDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-bs-theme', prefersDarkMode ? 'dark' : 'light');
  })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ошибка 404: страница не найдена.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="page-header mb-4">
    <h1><a href="/">{{.Domain}}</a> <small class="text-muted">| Ошибка 404: страница не найдена.</small></h1>
  </div>

  <div class="alert {{if .IsAdmin}}alert-success{{else}}alert-info{{end}}" role="alert">
    Страница <strong>{{.Path}}</strong> не найдена. Пожалуйста <a class="alert-link" href="{{if .EditLink}}{{.EditLink}}{{else}}{{.Path}}?edit{{end}}">создайте эту страницу</a>.
  </div>

  {{if .IsAdmin}}
  <form class="card card-body shadow-sm mt-3" method="post" action="/grab" style="max-width:680px;">
    <input type="hidden" name="path" value="{{.Path}}">
    <input type="hidden" name="progress_token" id="progress_token" value="">
    <label class="form-label" for="source_url">Или скопируйте страницу с другого сайта:</label>
    <div class="input-group">
      <input id="source_url" name="source_url" type="url" class="form-control" placeholder="https://example.com/page" required>
      <button type="submit" class="btn btn-success">Скопировать</button>
    </div>
  </form>
  <div class="modal fade" id="grabProgressModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header">
      <h5 class="modal-title" id="grab_modal_title">Загрузка страницы</h5>
      <button type="button" class="btn-close d-none" id="grab_modal_header_close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
    </div><div class="modal-body">
      <p id="grab_progress_text">Подготовка...</p>
      <div class="progress" id="grab_progress_holder"><div class="progress-bar" id="grab_progress_bar" role="progressbar" style="width:0%;">0%</div></div>
      <small id="grab_progress_url" class="text-muted d-block mt-2"></small>
      <div id="grab_resource_list" class="list-group small mt-3 d-none" style="max-height:260px;overflow:auto;"></div>
    </div><div class="modal-footer">
      <button type="button" class="btn btn-outline-secondary" id="grab_cancel_button" data-bs-dismiss="modal">Отмена</button>
      <button type="button" class="btn btn-success" id="grab_continue_button">Продолжить</button>
      <button type="button" class="btn btn-primary d-none" id="grab_close_button" data-bs-dismiss="modal">Закрыть</button>
    </div></div></div>
  </div>
  {{end}}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function setupGrabProgress() {
  const grabFormElement = document.querySelector('form[action="/grab"]');
  if (!grabFormElement) { return; }
  const tokenFieldElement = document.getElementById('progress_token');
  const sourceUrlElement = document.getElementById('source_url');
  const submitButtonElement = grabFormElement.querySelector('button[type="submit"]');
  const modalTitleElement = document.getElementById('grab_modal_title');
  const progressTextElement = document.getElementById('grab_progress_text');
  const progressHolderElement = document.getElementById('grab_progress_holder');
  const progressBarElement = document.getElementById('grab_progress_bar');
  const progressUrlElement = document.getElementById('grab_progress_url');
  const resourceListElement = document.getElementById('grab_resource_list');
  const progressModalElement = document.getElementById('grabProgressModal');
  const headerCloseButtonElement = document.getElementById('grab_modal_header_close');
  const cancelButtonElement = document.getElementById('grab_cancel_button');
  const continueButtonElement = document.getElementById('grab_continue_button');
  const closeButtonElement = document.getElementById('grab_close_button');
  const progressModalController = new bootstrap.Modal(progressModalElement, { backdrop: 'static', keyboard: false });

  let progressSocket = null;
  let confirmedSubmitStarted = false;

  function setModalClosable(closable) {
    headerCloseButtonElement.classList.toggle('d-none', !closable);
    closeButtonElement.classList.toggle('d-none', !closable);
  }

  function setProgressPercent(percentNumber) {
    const boundedPercent = Math.max(0, Math.min(100, Number(percentNumber) || 0));
    progressBarElement.style.width = boundedPercent + '%';
    progressBarElement.textContent = boundedPercent + '%';
    progressBarElement.setAttribute('aria-valuenow', String(boundedPercent));
  }

  function clearResourceList() {
    resourceListElement.replaceChildren();
    resourceListElement.classList.add('d-none');
  }

  function showPreviewLoading() {
    modalTitleElement.textContent = 'Проверка ресурсов';
    progressTextElement.textContent = 'Смотрим, какие ресурсы есть на странице...';
    progressHolderElement.classList.add('d-none');
    progressUrlElement.textContent = sourceUrlElement.value;
    clearResourceList();
    setModalClosable(false);
    cancelButtonElement.classList.remove('d-none');
    continueButtonElement.classList.add('d-none');
    progressModalController.show();
  }

  function showPreviewError(previewError) {
    modalTitleElement.textContent = 'Ошибка проверки';
    progressTextElement.textContent = previewError.message || 'Не удалось проверить ресурсы страницы.';
    progressHolderElement.classList.add('d-none');
    progressUrlElement.textContent = sourceUrlElement.value;
    clearResourceList();
    setModalClosable(true);
    cancelButtonElement.classList.add('d-none');
    continueButtonElement.classList.add('d-none');
    if (submitButtonElement) { submitButtonElement.disabled = false; }
  }

  function appendPreviewResource(previewResource) {
    const resourceRowElement = document.createElement('div');
    resourceRowElement.className = 'list-group-item d-flex gap-2 align-items-start';
    const kindElement = document.createElement('span');
    kindElement.className = 'badge text-bg-secondary flex-shrink-0';
    kindElement.textContent = previewResource.kind || 'file';
    const urlElement = document.createElement('span');
    urlElement.className = 'text-break';
    urlElement.textContent = previewResource.url;
    resourceRowElement.appendChild(kindElement);
    resourceRowElement.appendChild(urlElement);
    resourceListElement.appendChild(resourceRowElement);
  }

  function showResourcePreview(previewPayload) {
    modalTitleElement.textContent = 'Подтвердите загрузку';
    progressHolderElement.classList.add('d-none');
    const resourceCount = Number(previewPayload.resource_count) || 0;
    progressTextElement.textContent = 'Будет скачан HTML страницы и ресурсов: ' + resourceCount + '. Продолжить?';
    progressUrlElement.textContent = previewPayload.source_url || sourceUrlElement.value;
    clearResourceList();
    if (resourceCount > 0) {
      resourceListElement.classList.remove('d-none');
      for (const previewResource of previewPayload.resources || []) {
        appendPreviewResource(previewResource);
      }
    }
    setModalClosable(true);
    cancelButtonElement.classList.remove('d-none');
    continueButtonElement.classList.remove('d-none');
    if (submitButtonElement) { submitButtonElement.disabled = false; }
  }

  function showDownloadProgress() {
    modalTitleElement.textContent = 'Загрузка страницы';
    progressTextElement.textContent = 'Начинаем загрузку...';
    progressHolderElement.classList.remove('d-none');
    progressUrlElement.textContent = '';
    clearResourceList();
    setProgressPercent(0);
    setModalClosable(false);
    cancelButtonElement.classList.add('d-none');
    continueButtonElement.classList.add('d-none');
  }

  function showDownloadError(errorText) {
    modalTitleElement.textContent = 'Ошибка загрузки';
    progressTextElement.textContent = errorText;
    setModalClosable(true);
    cancelButtonElement.classList.add('d-none');
    continueButtonElement.classList.add('d-none');
    if (submitButtonElement) { submitButtonElement.disabled = false; }
  }

  function connectProgressSocket(progressToken) {
    const socketProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    progressSocket = new WebSocket(socketProtocol + '//' + window.location.host + '/grab/ws?token=' + encodeURIComponent(progressToken));
    progressSocket.onmessage = function onSocketMessage(messageEvent) {
      let progressState = null;
      try {
        progressState = JSON.parse(messageEvent.data);
      } catch (parseError) {
        showDownloadError('Сервер прислал некорректный статус загрузки.');
        progressSocket.close();
        return;
      }
      const foundTotal = Number(progressState.found_total) || 0;
      const downloadedTotal = Number(progressState.downloaded_total) || 0;
      const remainingTotal = Math.max(foundTotal - downloadedTotal, 0);
      const completedPercent = Number(progressState.completed_percent) || 0;
      const remainingPercent = Math.max(100 - completedPercent, 0);
      setProgressPercent(completedPercent);
      progressTextElement.textContent = 'Скачано: ' + downloadedTotal + ' из ' + foundTotal + ' (' + completedPercent + '%). Осталось: ' + remainingTotal + ' (' + remainingPercent + '%).';
      progressUrlElement.textContent = progressState.current_url || '';
      if (progressState.stage === 'done') {
        setProgressPercent(100);
        progressTextElement.textContent = 'Готово. Открываем редактор...';
        progressSocket.close();
      }
      if (progressState.stage === 'error') {
        showDownloadError('Не удалось скачать страницу. Окно можно закрыть и попробовать другой адрес.');
        progressSocket.close();
      }
    };
    progressSocket.onerror = function onSocketError() {
      showDownloadError('Потеряно соединение со статусом загрузки. Окно можно закрыть.');
    };
  }

  function startConfirmedDownload() {
    const progressToken = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    tokenFieldElement.value = progressToken;
    showDownloadProgress();
    connectProgressSocket(progressToken);
    confirmedSubmitStarted = true;
    grabFormElement.submit();
  }

  function requestGrabPreview() {
    showPreviewLoading();
    if (submitButtonElement) { submitButtonElement.disabled = true; }
    const previewRequestBody = new FormData(grabFormElement);
    fetch('/grab/preview', { method: 'POST', body: previewRequestBody, headers: { 'Accept': 'application/json' } })
      .then(function handlePreviewHTTPResponse(previewHTTPResponse) {
        if (!previewHTTPResponse.ok) {
          return previewHTTPResponse.text().then(function throwPreviewHTTPError(errorText) {
            throw new Error(errorText || 'Не удалось проверить ресурсы страницы.');
          });
        }
        return previewHTTPResponse.json();
      })
      .then(function handlePreviewPayload(previewPayload) {
        showResourcePreview(previewPayload);
      })
      .catch(function handlePreviewFailure(previewError) {
        showPreviewError(previewError);
      });
  }

  continueButtonElement.addEventListener('click', function onContinueClick() {
    startConfirmedDownload();
  });

  progressModalElement.addEventListener('hidden.bs.modal', function onProgressModalHidden() {
    if (progressSocket) {
      progressSocket.close();
      progressSocket = null;
    }
  });

  grabFormElement.addEventListener('submit', function onGrabSubmit(submitEvent) {
    if (confirmedSubmitStarted) { return; }
    submitEvent.preventDefault();
    if (!grabFormElement.checkValidity()) {
      grabFormElement.reportValidity();
      return;
    }
    requestGrabPreview();
  });
})();
</script>
</body>
</html>
