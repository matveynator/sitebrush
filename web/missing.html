<!doctype html>
<html lang="ru" id="SiteBrush">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ошибка 404: страница не найдена.</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #ffffff; color: #1f2d3d; }
    .page-wrap { margin: 40px; }
    .page-header h1 { margin: 0 0 16px; font-size: 32px; font-weight: 600; }
    .page-header small { color: #74839a; font-size: 20px; }
    .page-header a { color: #2466c2; text-decoration: none; }
    .alert-box { padding: 14px 16px; border-radius: 4px; border: 1px solid; font-size: 17px; }
    .alert-info { background: #eaf4ff; border-color: #b9d9ff; color: #1c4f8c; }
    .alert-success { background: #efffdd; border-color: #c3e39a; color: #3f6b10; }
    .alert-box a { color: inherit; font-weight: 600; }
  </style>
</head>
<body>
<div class="page-wrap">
  <div class="page-header"><h1><a href="/">{{.Domain}}</a> <small>| Ошибка 404: страница не найдена.</small></h1></div>
  <div class="alert-box {{if .IsAdmin}}alert-success{{else}}alert-info{{end}}">
    Пожалуйста <a href="{{if .EditLink}}{{.EditLink}}{{else}}{{.Path}}?edit{{end}}">создайте эту страницу</a> или <a href="?grab">скопируйте с другого сайта</a>.
  </div>
</div>
</body>
</html>
