<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Files</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div class="container py-4">
<h1 class="h4 mb-3"><a href="/" class="text-decoration-none">{{.Domain}}</a> · <img src="/p/static/upload.png" width="18" alt=""> {{index .T "file_manager"}}</h1>
<p><a href="{{.Path}}">{{index .T "back_to_uri"}}</a></p>
{{range .Files}}
<div class="card mb-2"><div class="card-body d-flex justify-content-between align-items-center"><a href="/assets/{{.Name}}" target="_blank">{{.Name}}</a> <small class="text-muted">({{.Size}} bytes)</small>
<form method="post" action="/files?path={{$.Path}}" style="display:inline"><input type="hidden" name="name" value="{{.Name}}"/><button class="btn btn-outline-danger btn-sm"><img src="/p/static/cross.png" width="14" alt="">Delete</button></form>
</div></div>
{{end}}
</div>
</body>
</html>
