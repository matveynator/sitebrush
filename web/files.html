<!doctype html>
<html id="SiteBrush" lang="en">
<head>
  <script>
  (function applySystemThemeMode() {
    const prefersDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-bs-theme', prefersDarkMode ? 'dark' : 'light');
  })();
  </script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Files</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="page-header mb-4 d-flex flex-wrap align-items-center justify-content-between gap-2">
    <h1 class="m-0">
      <a href="/">{{.Domain}}</a>
      <small class="text-muted">| <img src="/p/static/upload.png" width="18" alt=""> {{index .T "file_manager"}}</small>
    </h1>
    <a class="btn btn-outline-secondary" href="{{.Path}}">{{index .T "back_to_uri"}}</a>
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle mb-0">
        <thead><tr><th>File</th><th>Size</th><th>Access</th><th>Actions</th></tr></thead>
        <tbody>
{{range .Files}}
<tr>
  <td><a href="{{.AssetPath}}" target="_blank">{{.Name}}</a></td>
  <td><small class="text-muted">{{.Size}} bytes</small></td>
  <td>
    <form method="post" action="/files?path={{$.Path}}" class="row g-2">
      <input type="hidden" name="action" value="save_access"/>
      <input type="hidden" name="name" value="{{.Name}}"/>
      <div class="col-auto">
        <select name="access_mode" class="form-select form-select-sm">
          <option value="public" {{if ne .AccessMode "token"}}selected{{end}}>public</option>
          <option value="token" {{if eq .AccessMode "token"}}selected{{end}}>token</option>
        </select>
      </div>
      <div class="col-auto"><input name="access_token" class="form-control form-control-sm" placeholder="token" value="{{.Token}}"></div>
      <div class="col-auto"><input name="access_days" class="form-control form-control-sm" type="number" min="0" placeholder="days"></div>
      <div class="col-auto"><input name="single_use_left" class="form-control form-control-sm" type="number" min="0" placeholder="one-time uses" value="{{if ge .SingleUseLeft 0}}{{.SingleUseLeft}}{{end}}"></div>
      <div class="col-auto"><button class="btn btn-sm btn-outline-primary">save</button></div>
    </form>
    {{if .ExpiresAt}}<small class="text-muted">expires: {{.ExpiresAt}}</small>{{end}}
  </td>
  <td>
    <form method="post" action="/files?path={{$.Path}}" style="display:inline"><input type="hidden" name="name" value="{{.Name}}"/><button class="btn btn-outline-danger btn-sm"><img src="/p/static/cross.png" width="14" alt="">Delete</button></form>
  </td>
</tr>
{{else}}
<tr><td colspan="4" class="text-center text-muted py-4">No files yet.</td></tr>
{{end}}
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
