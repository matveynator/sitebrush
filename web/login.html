<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sitebrush Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #eaf3fb url('/p/static/bg.png') repeat; }
    .brand-panel { background: linear-gradient(135deg,#2d6cdf,#5da6ff); color:#fff; border-radius:14px; box-shadow:0 10px 25px rgba(0,0,0,.15); }
    .icon-label { width:18px; margin-right:8px; }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="brand-panel p-4 mb-4 d-flex align-items-center gap-3">
        <img src="/p/static/profile.png" width="36" alt="profile">
        <div><h1 class="h4 mb-0">Sitebrush Admin</h1><small>Welcome back</small></div>
      </div>
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form method="post" action="/login" class="vstack gap-3">
            <input class="form-control" name="email" placeholder="Email"/>
            <input class="form-control" name="password" type="password" placeholder="Password"/>
            <button class="btn btn-primary"><img class="icon-label" src="/p/static/accept.png" alt="">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
