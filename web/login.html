<!doctype html>
<html id="SiteBrush" lang="en">
<head>
  <script>
  (function applySystemThemeMode() {
    const prefersDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-bs-theme', prefersDarkMode ? 'dark' : 'light');
  })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{index .T "login_title"}}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="page-header mb-4">
    <h1><a href="/">{{.Domain}}</a> <small class="text-muted">| {{index .T "login_header"}}</small></h1>
  </div>
  <form class="card card-body shadow-sm" method="post" action="?login" style="max-width:520px;">
    <input type="hidden" name="return_path" value="{{.ReturnPath}}">
    <p><input type="email" name="email" class="form-control" placeholder="{{index .T "login_email_placeholder"}}"></p>
    <p><input type="password" name="password" class="form-control" placeholder="{{index .T "login_password_placeholder"}}"></p>
    <div class="d-flex gap-2">
      <input type="submit" class="btn btn-primary" value="{{index .T "login_submit"}}"/>
      <a href="?register" class="btn btn-outline-primary">Register</a>
    </div>
  </form>
  <p class="mt-3"><a href="?recover">{{index .T "login_forgot"}}</a></p>
</div>
</body>
</html>
