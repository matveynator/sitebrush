<!doctype html>
<html id="SiteBrush" lang="en">
<head>
  <script>
  (function applySystemThemeMode() {
    const prefersDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-bs-theme', prefersDarkMode ? 'dark' : 'light');
  })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{index .T "setup_create_admin"}}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/p/static/technical_pages.css" rel="stylesheet">
</head>
<body class="technical-page bg-body">
<div class="container py-5">
  <div class="page-header mb-4">
    <h1 class="section-heading"><img src="/p/static/profile.png" class="section-icon" alt=""><a href="/">{{.Domain}}</a> <small class="text-muted">| {{index .T "setup_no_admin"}}</small></h1>
  </div>
  <p class="text-muted">{{index .T "setup_first_visitor"}}</p>
  <form class="card card-body" method="post" action="?register" style="max-width:520px;">
    <p><input type="email" name="email" class="form-control" placeholder="{{index .T "login_email_placeholder"}}" required></p>
    <p><input type="password" name="password" class="form-control" placeholder="{{index .T "login_password_placeholder"}}" required></p>
    <div><button type="submit" class="btn btn-primary">{{index .T "setup_create_admin"}}</button></div>
  </form>
</div>
</body>
</html>
