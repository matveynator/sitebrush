<!doctype html><html lang="{{.LanguageCode}}" dir="{{.TextDirection}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{index .T "profile_password_code_submit"}} · {{.Domain}}</title><link rel="stylesheet" href="/p/static/technical_pages.css"></head><body class="technical-page"><main class="container authentication-shell"><form class="authentication-card profile-form" method="post" action="?email_confirm={{.Token}}"><h1>{{.Domain}}</h1><p>{{index .T "auth_confirm_hint"}}</p><p>{{if .CurrentEmail}}<strong dir="ltr">{{.CurrentEmail}}</strong> → {{end}}<strong dir="ltr">{{.Email}}</strong></p>{{if .SetPassword}}<p>{{index .T "auth_registration_secure"}}</p><label>{{index .T "login_password_placeholder"}}<input type="password" name="password" autocomplete="new-password" required></label><label>{{index .T "profile_confirm_password"}}<input type="password" name="password_confirm" autocomplete="new-password" required></label>{{end}}<button type="submit">{{index .T "profile_password_code_submit"}}</button><p>{{index .T "auth_ignore"}}</p></form></main><span hidden data-account-code-tools data-copy-label="{{index .T "auth_copy"}}" data-copy-success="{{index .T "auth_copied"}}" data-copy-error="{{index .T "auth_copy_failed"}}"></span>
<script src="/p/static/account-forms.js" defer></script>
</body></html>
