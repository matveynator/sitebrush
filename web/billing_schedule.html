<!doctype html>
<html lang="{{.LanguageCode}}" dir="{{.TextDirection}}" id="SiteBrush">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{{.Title}}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/p/static/technical_pages.css" rel="stylesheet">
</head>
<body class="technical-page bg-body">
<main class="container py-5" style="max-width:760px">
  <header class="page-header mb-4"><h1 class="section-heading"><img src="/p/static/sitebrush-app-icon.png" class="section-icon" alt="">SiteBrush <small class="text-muted">| {{.Title}}</small></h1></header>
  {{if .Status}}<div class="alert alert-info">{{.Status}}</div>{{end}}
  <section class="card billing-card"><div class="card-body">
    <p class="text-muted">{{.Customer.PrimaryEmail}}</p>
    <form method="post" action="?billing_schedule&token={{.Token}}" class="billing-plan-form" data-billing-public-schedule>
      <label>{{index .T "billing_invoice_day"}} <input type="number" name="invoice_day" class="form-control" min="1" max="28" value="{{.Customer.InvoiceDay}}" required></label>
      <label>{{index .T "billing_payment_term_days"}} <input type="number" name="payment_term_days" class="form-control" min="1" max="60" value="{{.Customer.PaymentTermDays}}" required></label>
      <label>{{index .T "billing_timezone"}} <input type="text" name="timezone" class="form-control" value="{{.Customer.Timezone}}" required data-billing-timezone></label>
      <button type="submit" class="btn btn-primary">{{index .T "billing_save"}}</button>
    </form>
  </div></section>
</main>
<script>(function(){const timezoneInput=document.querySelector('[data-billing-timezone]');if(timezoneInput&&timezoneInput.value==='UTC'&&Intl&&Intl.DateTimeFormat){timezoneInput.value=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';}})();</script>
</body>
</html>
