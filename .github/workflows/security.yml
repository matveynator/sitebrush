name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  tests:
    name: tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Database coverage details
        run: |
          set +e
          go test -count=1 -covermode=atomic -coverprofile=database-coverage.out ./pkg/database
          status=$?
          if [ -f database-coverage.out ]; then
            go tool cover -func=database-coverage.out
          fi
          echo "database test status: $status"
          exit 0
      - name: Test packages
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./pkg/... ./scripts/...
      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -n 1
      - name: Report database coverage
        run: go tool cover -func=coverage.out | grep '/pkg/database/' || true
      - name: Enforce database coverage
        run: |
          go test -count=1 -covermode=atomic -coverprofile=database-coverage.out ./pkg/database
          coverage="$(go tool cover -func=database-coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          echo "pkg/database coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 90) { printf "pkg/database coverage %.1f%% is below required 90%%\n", coverage; exit 1 } }'
      - name: Report package coverage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package-coverage
          mkdir package-coverage
          while IFS= read -r package; do
            safe_name="${package//\//_}"
            profile="package-coverage/${safe_name}.out"
            output="$(go test -count=1 -covermode=atomic -coverprofile="$profile" "$package" 2>&1)"
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -q '\[no statements\]'; then
              continue
            fi
            coverage="$(go tool cover -func="$profile" | awk '/^total:/ {gsub("%", "", $3); print $3}')"
            printf '%s coverage: %s%%\n' "$package" "$coverage"
            if awk -v coverage="$coverage" 'BEGIN { exit !(coverage + 0 < 90) }'; then
              go tool cover -func="$profile"
            fi
          done < <(go list ./pkg/... ./scripts/...)
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          fail_ci_if_error: true
          files: coverage.out
          use_oidc: true
      - name: Enforce lock-free architecture
        run: go test -count=1 ./scripts/architecture
      - name: Test security boundaries and demo
        run: >-
          go test -count=1 .
          -run 'Test(StorageJail|PublishedStaticRejectsSymlink|PublicOutbound|RequirePublicOutboundURL|ParseGrabSourceURL|ParseOptionalGrabSourceIP|LogoutRedirectsToSameURI|AutoCertDiskCache|AutomaticSSLCertificateCacheName|SecurityBoundaryGlobalSyncStopsWhenSignalChannelCloses|SecurityBoundarySecuritySignalCannotForgeQuorumWithEmbeddedInstallationIDs)'
      - name: Test demo landing
        run: go test -count=1 . -run '^TestDemoSiteVisitorGetsEditorSessionAndCleanupDeletesSite$'

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Check reachable vulnerabilities
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - name: Scan path and request taint
        id: scan
        continue-on-error: true
        run: gosec -include=G703,G704 -fmt=sarif -out=gosec.sarif ./...
      - name: Upload gosec SARIF
        if: always() && hashFiles('gosec.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: gosec.sarif
          category: gosec
      - name: Require clean gosec result
        if: steps.scan.outcome != 'success'
        run: exit 1

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        language:
          - go
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Build Go
        if: matrix.language == 'go'
        run: go build ./...
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}
