name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CGO_ENABLED: "0"

jobs:
  update_native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test update packages and process lifecycle
        shell: bash
        run: go test -count=1 -timeout=180s ./pkg/appupdate ./pkg/updateannounce ./pkg/migrations ./pkg/authmail ./pkg/serviceinstall ./scripts/architecture
      # Durable migration fixtures perform many filesystem flushes on Windows.
      # Individual contact/process deadlines remain bounded by their tests.
      - name: Test server authorization and database maintenance
        shell: bash
        run: go test -v -count=1 -timeout=600s -run 'Test(ServerUpdate|Update)' .
      - name: Test site database ownership and migration
        shell: bash
        run: >-
          go test -count=1 -timeout=600s .
          -run '^Test(SiteSubsystem|SiteControl|LegacyAIMigration|LegacySitePartition|LegacyAnalytics|ConcurrentSiteControl|SiteDatabaseBackup|PartitionedSiteManagement)'

  update_crosscompile:
    runs-on: ubuntu-22.04
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile every native server platform
        run: go run ./scripts/crosscompile -mode server-app -version "${GITHUB_RUN_NUMBER}" -output-dir /tmp/sitebrush-update-builds

  tests:
    name: tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Database coverage details
        run: |
          set +e
          go test -count=1 -covermode=atomic -coverprofile=database-coverage.out ./pkg/database
          status=$?
          if [ -f database-coverage.out ]; then
            go tool cover -func=database-coverage.out
          fi
          echo "database test status: $status"
          exit 0
      - name: Test packages
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./pkg/... ./scripts/...
      - name: Test account email abuse boundaries and CAPTCHA
        run: >-
          go test -count=1 -timeout=300s .
          -run '^Test(AccountMailGuard|AccountCaptcha|Register|RegistrationCooldown|Recover|Recovery|SiteRequestStores|LocalhostWithoutSiteDatabase|UnknownAndDeletedHostnames)'
      - name: Test concise mail journal and transport attribution
        run: >-
          go test -count=1 -timeout=180s -covermode=atomic
          -coverpkg=./pkg/mailmonitor,./pkg/mailout,./pkg/mailguard,./pkg/hostingandsupport
          -coverprofile=mail-journal-coverage.out .
          -run '^Test(MailMonitor|MailJournal|MailControl|MailCancellation|MailTransport|HTTPSFallbackLog)'
      - name: Test old and new NetChan peers
        env:
          SITEBRUSH_NETCHAN_INTEROP_TEST: "1"
        run: go test -count=1 -timeout=180s -run '^TestLegacyNetChanWireCompatibility$' ./pkg/netchantls
      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -n 1
      - name: Report database coverage
        run: go tool cover -func=coverage.out | grep '/pkg/database/' || true
      - name: Enforce database coverage
        run: |
          go test -count=1 -covermode=atomic -coverprofile=database-coverage.out ./pkg/database
          coverage="$(go tool cover -func=database-coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          echo "pkg/database coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 90) { printf "pkg/database coverage %.1f%% is below required 90%%\n", coverage; exit 1 } }'
      - name: Report package coverage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package-coverage
          mkdir package-coverage
          while IFS= read -r package; do
            safe_name="${package//\//_}"
            profile="package-coverage/${safe_name}.out"
            package_test_status=0
            output="$(go test -count=1 -covermode=atomic -coverprofile="$profile" "$package" 2>&1)" || package_test_status=$?
            printf '%s\n' "$output"
            if [ "$package_test_status" -ne 0 ]; then
              exit "$package_test_status"
            fi
            if printf '%s\n' "$output" | grep -q '\[no statements\]'; then
              continue
            fi
            coverage="$(go tool cover -func="$profile" | awk '/^total:/ {gsub("%", "", $3); print $3}')"
            printf '%s coverage: %s%%\n' "$package" "$coverage"
            if awk -v coverage="$coverage" 'BEGIN { exit !(coverage + 0 < 90) }'; then
              go tool cover -func="$profile"
            fi
          done < <(go list ./pkg/... ./scripts/...)
      - name: Cover application update and migration boundaries
        run: >-
          go test -count=1 -covermode=atomic
          -coverpkg=./pkg/appupdate,./pkg/updateannounce,./pkg/migrations,./pkg/authmail,./pkg/hostingandsupport,./pkg/serviceinstall
          -coverprofile=application-update-coverage.out
          -run 'Test(ServerUpdate|Update|AccountLegacySessionsInvalidatedOnce|AdminIPOptInMigrationRunsForPreviousSchemaVersion)' .
      - name: Enforce lock-free architecture
        run: go test -count=1 ./scripts/architecture
      - name: Test saved browser page imports
        run: go test -count=1 -timeout=180s -run '^TestSavedPage' .
      - name: Test analytics sessions and graceful shutdown
        run: >-
          go test -count=1 .
          -run '^(TestAccountSession|TestAnalytics(SeparatesSession|LiveFlush|Rotation|DiskQuota)|TestConversion(Beacon|Configuration|Preview|Publication|InitialGoals|Stealth|ReportRead)|TestHostingSnapshot(Schema|Compatibility)|TestBrowserAnalytics(Shutdown|WebSocketDelivery)|TestMergedAudiencePercentages|TestControlDatabaseShutdown|TestControlReader|TestRepeatedInterrupt|TestSecurityBlockPagination|TestBlockedIPStatistics)'
      - name: Test security boundaries and demo
        run: >-
          go test -count=1 .
          -run 'Test(StorageJail|PublishedStaticRejectsSymlink|PublicOutbound|RequirePublicOutboundURL|ParseGrabSourceURL|ParseOptionalGrabSourceIP|LogoutRedirectsToSameURI|AutoCertDiskCache|AutomaticSSLCertificateCacheName|SecurityBoundaryGlobalSyncStopsWhenSignalChannelCloses|SecurityBoundarySecuritySignalCannotForgeQuorumWithEmbeddedInstallationIDs|SecurityBoundaryBackupImport|SecurityBoundaryProfileSensitiveActionsRequireCSRF|SecurityBoundaryFileUpload|SecurityBoundaryAuthenticatedMutation|SecurityBoundaryClientIPAddress|SecurityBoundaryMissingPageEscapesReflectedPath|SecurityBoundaryServiceEndpointsRejectMalformedJSON|SecurityBoundaryHostingSnapshotRejectsOversizedBody)'
      - name: Test demo landing
        run: go test -count=1 . -run '^TestDemoSiteVisitorGetsEditorSessionAndCleanupDeletesSite$'
      - name: Test editor, account and site lifecycle regressions
        env:
          SITEBRUSH_SERVICE_MAIL_MODE: local
        run: >-
          go test -count=1 .
          -run '^(TestAnalyticsServerRulesProduceBrowserConversion|TestFinalPageSaveCreatesOneRevisionPerChangedPage|TestDemoRefreshReplacesPageSetAndFirstImportCreatesDatabase|TestUnknownAndDeletedHostnamesOfferRegistrationOrRequest|TestPreparedImageUploadStoresActualCropAndSinglePageRevision|TestPreparedExternalImageUsesValidatedServerDownloadWithoutCORS|TestCreationLimitsAreIndependentAndPreserveExistingSites|TestRecreatedSiteKeepsCertificateAndRejectsExpiredCache|TestProfilePaginatesAIAccessAndKeepsSessionIPOrder|TestProfileSecurityCardsShareGridAndPaginateThreeRecords|TestProfileAdminIPUpdatesKeepSettingsAndShowValidation|TestLANPasswordLoginAcceptsFormWithStaleCookieAndOpaqueOrigin|TestPageSaveRollsBackPublicationWhenAnotherPageCannotBeWritten|TestDemoSnapshotRestoreHonorsNewQuotaBeforeReplacingContent|TestConcurrentIdenticalPageSavesCreateOneRevision|TestPreparedImageDeduplicatesPreviewAndFullStorage|TestMissingRegisteredDatabaseDoesNotOfferNewOwnership|TestClosedRegistrationRejectsPreviouslyIssuedConfirmation)$'
      - name: Test site-wide AI capability boundaries
        run: >-
          go test -count=1 .
          -run '^(TestAI(Site|CapabilityScopes|CapabilityRevocation|ConcurrentVersion|VersionGuard|Uploads|EditorInlineAttachments|PageSave|Rollback|Unscoped|FileEndpoint|PageScoped)|TestAppAIStore)'
      - name: Test Remote MCP authorization and site lifecycle
        run: go test -count=1 -timeout=180s . -run '^TestMCP'
      - name: Test hidden AI ingress and site database ownership
        run: >-
          go test -count=1 -timeout=180s -covermode=atomic
          -coverpkg=./pkg/aicapability,./pkg/aiingress,./pkg/analytics,./pkg/appupdate,./pkg/storagejail
          -coverprofile=application-ai-coverage.out .
          -run '^Test(MCP|AIRestoredRoutes|AISiteTools|AIImport|AIIngress|AIProviderGate|SiteSubsystem|SiteControl|LegacyAIMigration|LegacySitePartition|LegacyAnalytics|ConcurrentSiteControl|SiteDatabaseBackup|HiddenAISelectors|PartitionedSiteManagement)'
      - name: Test public routing and AI editor regressions
        run: >-
          go test -count=1 .
          -run '^Test(PublishedStaticHTMLUsesBrowserContentType|PagePasswordProtection|AIEditorPageEmbedsSessionCSRF|AIEditorRendersCompletedDraft|AIEditorTemplateTreatsClarification|BlockedAdminIPSeesStaticSite|BrowserAnalyticsQuery)'
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          fail_ci_if_error: true
          files: coverage.out,application-update-coverage.out,application-ai-coverage.out,mail-journal-coverage.out
          use_oidc: true
      - name: Install editor browser test dependencies
        working-directory: scripts/editor
        run: |
          npm ci --ignore-scripts
          node document_test.cjs
          node ../../pkg/appupdate/server_update_test.cjs
          node ../../pkg/imageprepare/image_replacement_test.cjs
          node ../../pkg/analytics/browser_test.cjs
          node ../../pkg/accountpasskey/browser_test.cjs
          node ../../pkg/mailguard/registration_cooldown_test.cjs
          npx playwright install --with-deps chromium
      - name: Test conversion analytics on desktop and narrow mobile
        env:
          SITEBRUSH_ANALYTICS_BROWSER_TEST: "1"
        run: go test -count=1 . -run '^TestConversionBrowserRegressions$'
      - name: Test MCP connection, owner approval and AI editor in Chromium
        env:
          SITEBRUSH_MCP_BROWSER_TEST: "1"
        run: go test -count=1 -timeout=180s . -run '^Test(MCPApprovalBrowserRedirect|MCPConnectionAndAIEditorBrowser)$'
      - name: Test visual editor on desktop and narrow mobile
        env:
          SITEBRUSH_EDITOR_BROWSER_TEST: "1"
        run: go test -count=1 . -run '^Test(VisualEditorBrowserRegressions|HTTPServerUsesAnotherPortWhenExistingProcessOwnsRequestedPort)$'

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Check reachable vulnerabilities
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gosec
        run: go -C scripts/securitytools build -o "$RUNNER_TEMP/gosec" github.com/securego/gosec/v2/cmd/gosec
      - name: Scan path and request taint
        id: scan
        continue-on-error: true
        run: '"$RUNNER_TEMP/gosec" -include=G703,G704 -fmt=sarif -out=gosec.sarif ./...'
      - name: Upload gosec SARIF
        if: always() && hashFiles('gosec.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: gosec.sarif
          category: gosec
      - name: Require clean gosec result
        if: steps.scan.outcome != 'success'
        run: exit 1

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-22.04
    # The SARIF gate must see the same findings on pull requests and main.
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    strategy:
      fail-fast: false
      matrix:
        language:
          - go
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Build Go
        if: matrix.language == 'go'
        run: go build ./...
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          upload: never
      - name: Require clean CodeQL result
        run: go run ./scripts/codeqlguard
      - name: Preserve failed CodeQL diagnostics for review
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: codeql-${{ matrix.language }}-diagnostics
          path: codeql-results
          retention-days: 3
      - name: Upload reviewed CodeQL result
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: codeql-results
          category: /language:${{ matrix.language }}
