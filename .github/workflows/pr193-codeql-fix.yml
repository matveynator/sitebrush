name: PR193 CodeQL path fix

on:
  push:
    branches:
      - codex/hidden-ai-site-databases

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CGO_ENABLED: "0"

jobs:
  fix:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.9"
          cache: true
      - name: Apply path fix
        run: python .github/pr193_codeql_fix.py
      - name: Format and test
        run: |
          gofmt -w sitebrush.go pkg/analytics/store.go
          go test -count=1 ./pkg/analytics
          go test -count=1 ./scripts/architecture
          go test -count=1 -timeout=180s . -run '^(TestPR193|Test.*LegacyAnalytics|Test.*AnalyticsMigration)'
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitebrush.go pkg/analytics/store.go
          git commit -m "fix: remove request data from analytics paths"
          git push origin HEAD:codex/hidden-ai-site-databases
