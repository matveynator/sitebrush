name: Stable Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/crosscompile/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CGO_ENABLED: '0'
  SITEBRUSH_NETCHAN_TLS_PUBLIC_KEY_SITEBRUSH_COM: ${{ vars.SITEBRUSH_NETCHAN_TLS_PUBLIC_KEY_SITEBRUSH_COM }}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'sitebrush-stable-release' || format('sitebrush-macos-desktop-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout complete release history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Resolve common local and GitHub release identity
        id: identity
        shell: bash
        run: echo "version=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
  build_server_app:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare_release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Test crosscompile helper
        shell: bash
        run: go test ./scripts/crosscompile

      - name: Build every server-app target from crosscompile.go
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/crosscompile \
            -mode server-app \
            -version "${{ needs.prepare_release.outputs.version }}" \
            -output-dir binaries

      - name: Upload server-app artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: server-app
          path: |
            binaries/${{ needs.prepare_release.outputs.version }}/server-app/*
          if-no-files-found: error

  build_desktop_docker:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare_release
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target_os:
          - linux
          - windows
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify Docker
        shell: bash
        run: docker info

      - name: Build desktop targets through crosscompile.go Docker builders
        shell: bash
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          go run ./scripts/crosscompile \
            -mode desktop-app \
            -os "${{ matrix.target_os }}" \
            -version "${{ needs.prepare_release.outputs.version }}" \
            -output-dir binaries

      - name: Upload desktop Docker artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-${{ matrix.target_os }}
          path: |
            binaries/${{ needs.prepare_release.outputs.version }}/desktop-app/*.zip
            binaries/${{ needs.prepare_release.outputs.version }}/desktop-app/MD5SUMS
          if-no-files-found: error

  prepare_macos_sdk:
    runs-on: macos-14
    steps:
      - name: Package the installed Xcode SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          sdk_path="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$sdk_path")"
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/$(basename "$sdk_path").tar.gz" -C "$(dirname "$sdk_path")" "$(basename "$sdk_path")"
      - name: Transfer SDK to the Docker compilation job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: macos-sdk
          path: ${{ runner.temp }}/MacOSX*.sdk.tar.gz
          retention-days: 1
          if-no-files-found: error

  build_desktop_macos_binaries:
    needs: [prepare_release, prepare_macos_sdk]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Download SDK
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: macos-sdk
          path: ${{ runner.temp }}/macos-sdk
      - name: Compile both macOS desktop architectures inside Docker
        shell: bash
        run: |
          set -euo pipefail
          sdk_archives=("$RUNNER_TEMP"/macos-sdk/*.tar.gz)
          test "${#sdk_archives[@]}" -eq 1
          go run ./scripts/crosscompile \
            -mode desktop-app -os darwin -arch universal \
            -macos-stage build -macos-sdk "${sdk_archives[0]}" \
            -version "${{ needs.prepare_release.outputs.version }}" -output-dir binaries
          tar -cf "$RUNNER_TEMP/macos-compiled.tar" \
            -C "binaries/${{ needs.prepare_release.outputs.version }}/desktop-app" \
            sitebrush_darwin_universal_desktop
      - name: Transfer compiled binary to the macOS packaging job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: macos-compiled
          path: ${{ runner.temp }}/macos-compiled.tar
          retention-days: 1
          if-no-files-found: error

  build_desktop_macos:
    needs: [prepare_release, build_desktop_macos_binaries]
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download Docker-compiled macOS binary
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: macos-compiled
          path: ${{ runner.temp }}/macos-compiled
      - name: Package macOS universal desktop without host CGO compilation
        shell: bash
        run: |
          set -euo pipefail
          desktop_directory="binaries/${{ needs.prepare_release.outputs.version }}/desktop-app"
          mkdir -p "$desktop_directory"
          tar -xf "$RUNNER_TEMP/macos-compiled/macos-compiled.tar" -C "$desktop_directory"
          go run ./scripts/crosscompile \
            -mode desktop-app \
            -os darwin \
            -arch universal \
            -macos-stage package \
            -version "${{ needs.prepare_release.outputs.version }}" \
            -output-dir binaries

      - name: Upload macOS desktop artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-darwin
          path: |
            binaries/${{ needs.prepare_release.outputs.version }}/desktop-app/*.dmg
            binaries/${{ needs.prepare_release.outputs.version }}/desktop-app/MD5SUMS
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - prepare_release
      - build_server_app
      - build_desktop_docker
      - build_desktop_macos
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go for release signing
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download server artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: server-app
          path: dist-raw/server-app
      - name: Download packaged desktop artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: desktop-*
          path: dist-raw

      - name: Assemble release files and aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release

          find dist-raw -type f \( \
            -name 'sitebrush_*' -o \
            -name '*.zip' -o \
            -name '*.dmg' \
          \) -exec cp {} dist-release/ \;

          if ! compgen -G 'dist-release/sitebrush_*' > /dev/null; then
            echo "No release artifacts were assembled" >&2
            exit 1
          fi

          (
            cd dist-release
            md5sum sitebrush_* > MD5SUMS
          )

          ls -lah dist-release
          cat dist-release/MD5SUMS

      - name: Sign native server update manifest
        shell: bash
        env:
          SITEBRUSH_RELEASE_PRIVATE_KEY: ${{ secrets.SITEBRUSH_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          go run ./scripts/releases -directory dist-release \
            -version "${{ needs.prepare_release.outputs.version }}" -commit "${GITHUB_SHA}"

      - name: Publish versioned server release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ needs.prepare_release.outputs.version }}
          name: "SiteBrush ${{ needs.prepare_release.outputs.version }}"
          make_latest: false
          prerelease: false
          overwrite_files: false
          files: |
            dist-release/sitebrush_*
            dist-release/SHA256SUMS
            dist-release/update.json

      - name: Publish GitHub Release (stable tag)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: stable-release
          name: "Stable Release"
          make_latest: true
          prerelease: false
          overwrite_files: true
          files: dist-release/*
