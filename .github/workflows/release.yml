name: Stable Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GO_VERSION: '1.26.6'

jobs:
  build_server_app:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: Test crosscompile helper
        shell: bash
        run: go test ./scripts/crosscompile

      - name: Build every server-app target from crosscompile.go
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/crosscompile \
            -mode server-app \
            -version "${GITHUB_RUN_NUMBER}" \
            -output-dir binaries

      - name: Upload server-app artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: server-app
          path: |
            binaries/${{ github.run_number }}/server-app/*
          if-no-files-found: error

  build_desktop_docker:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target_os:
          - linux
          - windows
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: Verify Docker
        shell: bash
        run: docker info

      - name: Build desktop targets through crosscompile.go Docker builders
        shell: bash
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          go run ./scripts/crosscompile \
            -mode desktop-app \
            -os "${{ matrix.target_os }}" \
            -version "${GITHUB_RUN_NUMBER}" \
            -output-dir binaries

      - name: Upload desktop Docker artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-${{ matrix.target_os }}
          path: |
            binaries/${{ github.run_number }}/desktop-app/*.zip
            binaries/${{ github.run_number }}/desktop-app/MD5SUMS
          if-no-files-found: error

  build_desktop_macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: Build macOS universal desktop through crosscompile.go
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/crosscompile \
            -mode desktop-app \
            -os darwin \
            -arch universal \
            -version "${GITHUB_RUN_NUMBER}" \
            -output-dir binaries

      - name: Upload macOS desktop artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-darwin
          path: |
            binaries/${{ github.run_number }}/desktop-app/*.dmg
            binaries/${{ github.run_number }}/desktop-app/MD5SUMS
          if-no-files-found: error

  release:
    needs:
      - build_server_app
      - build_desktop_docker
      - build_desktop_macos
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download all build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist-raw

      - name: Assemble release files and aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release

          find dist-raw -type f \( \
            -name 'sitebrush_*' -o \
            -name '*.zip' -o \
            -name '*.dmg' \
          \) -exec cp {} dist-release/ \;

          if ! compgen -G 'dist-release/sitebrush_*' > /dev/null; then
            echo "No release artifacts were assembled" >&2
            exit 1
          fi

          (
            cd dist-release
            md5sum sitebrush_* > MD5SUMS
          )

          ls -lah dist-release
          cat dist-release/MD5SUMS

      - name: Publish GitHub Release (stable tag)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: stable-release
          name: "Stable Release"
          make_latest: true
          prerelease: false
          overwrite_files: true
          files: dist-release/*
