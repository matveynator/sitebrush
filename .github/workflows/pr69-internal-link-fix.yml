name: PR69 internal resource fix

on:
  push:
    branches:
      - fix/import-resource-content-detection

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/import-resource-content-detection

      - name: Preserve result-host file links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("sitebrush.go")
          text = path.read_text()
          signature = "func (spider *pageSpider) rewriteDocumentResourceReference("
          start = text.find(signature)
          if start < 0:
              raise SystemExit("rewriteDocumentResourceReference not found")
          end = text.find("\nfunc ", start + len(signature))
          if end < 0:
              end = len(text)
          function = text[start:end]
          guard = "\tif isResultHostResourceURL(normalizedURL, spider.resultURL) {\n\t\treturn rawRef\n\t}\n"
          if guard not in function:
              anchor = "\tif spider.isSameHostWholeSitePageURL(normalizedURL) {"
              pos = function.find(anchor)
              if pos < 0:
                  raise SystemExit("same-host page guard not found in rewriteDocumentResourceReference")
              function = function[:pos] + guard + function[pos:]
              text = text[:start] + function + text[end:]
              path.write_text(text)
          PY

          cat > result_host_resource.go <<'EOF'
          package main

          import "net/url"

          // isResultHostResourceURL identifies resources that already belong to
          // the destination site. Re-importing those resources would replace a
          // live internal URL with a hashed mirrored asset.
          func isResultHostResourceURL(rawURL string, resultURL *url.URL) bool {
          	if resultURL == nil {
          		return false
          	}
          	linkedURL, err := url.Parse(rawURL)
          	if err != nil || linkedURL == nil {
          		return false
          	}
          	return sameHostname(linkedURL.Hostname(), resultURL.Hostname())
          }
          EOF

          cat > result_host_resource_test.go <<'EOF'
          package main

          import (
          	"net/url"
          	"testing"
          )

          func TestResultHostResourceURLPreserved(t *testing.T) {
          	resultURL, err := url.Parse("https://kavtrans.sitebrush.ru/")
          	if err != nil {
          		t.Fatal(err)
          	}
          	for _, rawURL := range []string{
          		"https://kavtrans.sitebrush.ru/files/map.pdf",
          		"https://KAVTRANS.SITEBRUSH.RU/files/archive.zip",
          	} {
          		if !isResultHostResourceURL(rawURL, resultURL) {
          			t.Fatalf("result-host resource was not preserved: %s", rawURL)
          		}
          	}
          	if isResultHostResourceURL("https://source.example/files/map.pdf", resultURL) {
          		t.Fatal("external resource was incorrectly treated as a result-host resource")
          	}
          	if isResultHostResourceURL("://bad-url", resultURL) {
          		t.Fatal("invalid URL was treated as a result-host resource")
          	}
          	if isResultHostResourceURL("https://kavtrans.sitebrush.ru/files/map.pdf", nil) {
          		t.Fatal("resource matched without a result URL")
          	}
          }
          EOF

          gofmt -w sitebrush.go result_host_resource.go result_host_resource_test.go
          git diff --check
          go test . -run TestResultHostResourceURLPreserved -count=1
          go test ./pkg/... -count=1

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pr69-internal-link-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitebrush.go result_host_resource.go result_host_resource_test.go .github/workflows/pr69-internal-link-fix.yml
          git commit -m "Preserve live internal file links"
          git push origin HEAD:fix/import-resource-content-detection
