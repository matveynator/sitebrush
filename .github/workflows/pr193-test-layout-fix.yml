name: PR193 test layout fix

on:
  push:
    branches:
      - codex/hidden-ai-site-databases

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CGO_ENABLED: "0"

jobs:
  fix:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.9"
          cache: true
      - name: Move root regressions into primary test file
        shell: python
        run: |
          from pathlib import Path

          source = Path("sitebrush_pr193_regression_test.go")
          if not source.exists():
              raise SystemExit(0)
          text = source.read_text()
          marker = "func TestPR193PartitionedAutomaticSSLCandidatesQueryOwnersSeparately"
          start = text.index(marker)
          tests = text[start:].strip() + "\n"
          primary = Path("sitebrush_test.go")
          current = primary.read_text()
          if marker not in current:
              primary.write_text(current.rstrip() + "\n\n" + tests)
          source.unlink()
      - name: Format and validate
        run: |
          gofmt -w sitebrush_test.go
          go test -count=1 ./scripts/architecture
          go test -count=1 -timeout=180s . -run '^TestPR193(PartitionedAutomaticSSLCandidatesQueryOwnersSeparately|AIIngressDecisionUsesRequestContext)$'
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitebrush_test.go sitebrush_pr193_regression_test.go
          git commit -m "test: keep PR 193 regressions in primary test file"
          git push origin HEAD:codex/hidden-ai-site-databases
