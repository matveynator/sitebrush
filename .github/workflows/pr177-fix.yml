name: PR 177 regression fixes

on:
  push:
    branches:
      - visual-editor

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-editor
          fetch-depth: 0

      - name: Apply focused regression fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sitebrush_test.go')
          text = path.read_text()

          old = '''func TestAuthAttackConcurrentPasswordChangeConfirmationAppliesOnce(t *testing.T) {
          \tapplication, database := newTestApplication(t)
          \tnow := time.Now().UTC()
          '''
          new = '''func TestAuthAttackConcurrentPasswordChangeConfirmationAppliesOnce(t *testing.T) {
          \tapplication, database := newTestApplication(t)
          \t// The production site DB serializes writes through its dedicated worker.
          \tdatabase.SetMaxOpenConns(1)
          \tnow := time.Now().UTC()
          '''
          if old not in text:
              raise SystemExit('password confirmation test anchor not found')
          text = text.replace(old, new, 1)

          old = '''\tapplication.aiContentEndpoint(revisionsResponse, revisionsRequest, "localhost", capabilityToken, "revisions")
          \tif revisionsResponse.Code != http.StatusOK || !strings.Contains(revisionsResponse.Body.String(), "<html><body>old</body></html>") {
          \t\tt.Fatalf("revisions status=%d body=%q", revisionsResponse.Code, revisionsResponse.Body.String())
          \t}
          '''
          new = '''\tapplication.aiContentEndpoint(revisionsResponse, revisionsRequest, "localhost", capabilityToken, "revisions")
          \tif revisionsResponse.Code != http.StatusOK {
          \t\tt.Fatalf("revisions status=%d body=%q", revisionsResponse.Code, revisionsResponse.Body.String())
          \t}
          \tvar revisionsPayload struct {
          \t\tRevisions []struct {
          \t\t\tHTML string `json:"html"`
          \t\t} `json:"revisions"`
          \t}
          \tif err := json.Unmarshal(revisionsResponse.Body.Bytes(), &revisionsPayload); err != nil {
          \t\tt.Fatalf("decode revisions response: %v body=%q", err, revisionsResponse.Body.String())
          \t}
          \tif len(revisionsPayload.Revisions) != 1 || revisionsPayload.Revisions[0].HTML != "<html><body>old</body></html>" {
          \t\tt.Fatalf("revisions payload=%+v", revisionsPayload)
          \t}
          '''
          if old not in text:
              raise SystemExit('revisions assertion anchor not found')
          text = text.replace(old, new, 1)

          old = '''\tif len(result.HTML) != len(currentHTML)+len("New title")-len("Old title") {
          \t\tt.Fatalf("compact patch unexpectedly rewrote page shape: before=%d after=%d", len(currentHTML), len(result.HTML))
          \t}
          '''
          new = '''\texpectedHTML := "<html><head><title>Catalog</title></head><body><h1>New title</h1><p class=\\"price\\">90</p><footer>Keep</footer></body></html>"
          \tif result.HTML != expectedHTML {
          \t\tt.Fatalf("compact patch unexpectedly rewrote page shape: got=%q want=%q", result.HTML, expectedHTML)
          \t}
          '''
          if old not in text:
              raise SystemExit('compact patch assertion anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          gofmt -w sitebrush_test.go

      - name: Verify focused regressions
        shell: bash
        run: |
          node scripts/editor/document_test.cjs
          go test . -run '^(TestAuthAttackConcurrentPasswordChangeConfirmationAppliesOnce|TestAIPageScopedCapabilityCanListRevisionsAndForceRollbackPath|TestAIEditorPatchProtocolAppliesMultipleCompactChanges)$' -count=1

      - name: Commit verified fixes and remove helper workflow
        shell: bash
        run: |
          git config user.name 'sitebrush-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pr177-fix.yml
          git add sitebrush_test.go
          git commit -m 'Fix PR 177 regression tests'
          git push origin HEAD:visual-editor
