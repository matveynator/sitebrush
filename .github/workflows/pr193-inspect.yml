name: PR193 fix

on:
  push:
    branches:
      - codex/hidden-ai-site-databases

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CGO_ENABLED: "0"

jobs:
  fix:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.9"
          cache: true
      - name: Apply reviewed fixes
        run: |
          python .github/pr193_fix.py
          python .github/pr193_fix_cross.py
      - name: Format
        run: gofmt -w sitebrush.go sitebrush_pr193_regression_test.go pkg/analytics/store.go pkg/analytics/path_security_test.go scripts/crosscompile/crosscompile.go scripts/crosscompile/crosscompile_test.go scripts/crosscompile/coverage_security_test.go
      - name: Test analytics path boundaries
        run: go test -count=1 ./pkg/analytics
      - name: Test server target matrix
        run: go test -count=1 ./scripts/crosscompile
      - name: Test SSL owner split and ingress decision reuse
        run: go test -count=1 -timeout=180s . -run '^TestPR193(PartitionedAutomaticSSLCandidatesQueryOwnersSeparately|AIIngressDecisionUsesRequestContext)$'
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitebrush.go sitebrush_pr193_regression_test.go pkg/analytics/store.go pkg/analytics/path_security_test.go scripts/crosscompile/crosscompile.go scripts/crosscompile/crosscompile_test.go scripts/crosscompile/coverage_security_test.go
          git commit -m "fix: address PR 193 review and security findings"
          git push origin HEAD:codex/hidden-ai-site-databases
