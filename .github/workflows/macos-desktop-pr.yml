name: macOS Desktop PR

on:
  pull_request:
    paths:
      - '.github/workflows/macos-desktop-pr.yml'
      - '.github/workflows/release.yml'
      - 'scripts/crosscompile/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CGO_ENABLED: '0'

concurrency:
  group: sitebrush-macos-desktop-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare_macos_sdk:
    runs-on: macos-15
    steps:
      - name: Package the installed Xcode SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          sdk_path="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$sdk_path")"
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/$(basename "$sdk_path").tar.gz" -C "$(dirname "$sdk_path")" "$(basename "$sdk_path")"
      - name: Transfer SDK to the Docker compilation job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: macos-sdk
          path: ${{ runner.temp }}/MacOSX*.sdk.tar.gz
          retention-days: 1
          if-no-files-found: error

  build_desktop_macos_binaries:
    needs: prepare_macos_sdk
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test crosscompile helper
        shell: bash
        run: go test ./scripts/crosscompile
      - name: Download SDK
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: macos-sdk
          path: ${{ runner.temp }}/macos-sdk
      - name: Compile both macOS desktop architectures inside Docker
        shell: bash
        run: |
          set -euo pipefail
          sdk_archives=("$RUNNER_TEMP"/macos-sdk/*.tar.gz)
          test "${#sdk_archives[@]}" -eq 1
          go run ./scripts/crosscompile \
            -mode desktop-app -os darwin -arch universal \
            -macos-stage build -macos-sdk "${sdk_archives[0]}" \
            -version "${{ github.run_number }}" -output-dir binaries
          tar -cf "$RUNNER_TEMP/macos-compiled.tar" \
            -C "binaries/${{ github.run_number }}/desktop-app" \
            sitebrush_darwin_universal_desktop
      - name: Transfer compiled binary to the macOS packaging job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: macos-compiled
          path: ${{ runner.temp }}/macos-compiled.tar
          retention-days: 1
          if-no-files-found: error

  build_desktop_macos:
    needs: build_desktop_macos_binaries
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Download Docker-compiled macOS binary
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: macos-compiled
          path: ${{ runner.temp }}/macos-compiled
      - name: Package macOS universal desktop without host CGO compilation
        shell: bash
        run: |
          set -euo pipefail
          desktop_directory="binaries/${{ github.run_number }}/desktop-app"
          mkdir -p "$desktop_directory"
          tar -xf "$RUNNER_TEMP/macos-compiled/macos-compiled.tar" -C "$desktop_directory"
          go run ./scripts/crosscompile \
            -mode desktop-app \
            -os darwin \
            -arch universal \
            -macos-stage package \
            -version "${{ github.run_number }}" \
            -output-dir binaries
      - name: Upload macOS desktop artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-darwin
          path: |
            binaries/${{ github.run_number }}/desktop-app/*.dmg
            binaries/${{ github.run_number }}/desktop-app/MD5SUMS
          if-no-files-found: error
