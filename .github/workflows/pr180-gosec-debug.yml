name: Diagnose analytics path finding

on:
  push:
    branches:
      - analytics-redesign
    paths:
      - .github/workflows/pr180-gosec-debug.yml

env:
  CGO_ENABLED: "0"

permissions:
  contents: read

jobs:
  gosec:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: analytics-redesign
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.9"
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - run: gosec -include=G703,G704 -fmt=text ./...
