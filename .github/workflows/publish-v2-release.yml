name: Publish SiteBrush v2.0.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release SiteBrush v2.0.0')
    runs-on: ubuntu-22.04
    steps:
      - name: Create GitHub Release and SemVer tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v2.0.0
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "SiteBrush v2.0.0"
          --notes "First Go release of SiteBrush v2. SiteBrush v1 was implemented in PHP."
