name: Finish analytics redesign blockers

on:
  push:
    branches:
      - analytics-redesign
    paths:
      - .github/workflows/pr180-finish.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analytics-redesign
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply reviewed fixes
        run: python3 scripts/pr180_fix.py
      - name: Format and test
        run: |
          gofmt -w sitebrush.go pkg/analytics/conversion.go pkg/analytics/store.go pkg/analytics/conversion_test.go pkg/analytics/store_test.go
          go test ./pkg/analytics
          go test ./...
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "analytics: finish privacy device and storage blockers"
          git push origin HEAD:analytics-redesign
